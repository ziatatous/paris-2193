<!doctype html>
<meta charset="utf-8">
<title>Paris 2193</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; --bg: #07090c; --fg: #b9bfc4; --dim: #6d747a; --neon: #ff2a6d; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; }
  /* Le canvas est dessiné en basse résolution (voir resize() dans le script) puis agrandi : look PS1 */
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; background: var(--bg); }
  /* Vignettage : les bords de l'écran s'assombrissent */
  #veil { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.7) 100%); }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.1rem; text-align: center; background: rgba(4,5,7,.88); cursor: pointer;
    padding: 1rem max(16px, env(safe-area-inset-left, 0px)); font-family: ui-monospace, "Courier New", monospace; }
  #start[hidden] { display: none; }
  #start h1 { margin: 0; font-size: clamp(2rem, 8vw, 4rem); letter-spacing: .35em; font-weight: 400; color: var(--neon);
    text-shadow: 0 0 12px rgba(255,42,109,.55); }
  #start p { margin: 0; max-width: 34rem; line-height: 1.6; font-size: .9rem; color: var(--dim); }
  #start b { color: var(--fg); font-weight: 400; }
  #go { margin-top: .5rem; border: 1px solid var(--neon); color: var(--neon); padding: .6rem 1.6rem; letter-spacing: .25em; font-size: .85rem; }
  #start:hover #go { background: var(--neon); color: #000; }
</style>

<canvas id="c"></canvas>
<div id="veil"></div>
<div id="start">
  <h1>PARIS 2193</h1>
  <p>Prototype : la ruelle.<br>Casque recommandé. Le son fait partie du jeu.</p>
  <p><b>Z Q S D</b> ou <b>W A S D</b> marcher · <b>Maj</b> courir · <b>Espace</b> sauter<br>
     <b>Souris</b> regarder · <b>M</b> couper la musique · <b>Échap</b> pause</p>
  <div id="go">ENTRER</div>
  <p id="note"></p>
</div>

<!-- Three.js : moteur 3D (version fixe) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const T = THREE;

/* =====================================================================
   0. OUTILS DE BASE
   ===================================================================== */
// Générateur aléatoire à graine : donne toujours la même ruelle.
let _s = 1337;
function rnd() { _s |= 0; _s = _s + 0x6D2B79F5 | 0; let t = Math.imul(_s ^ _s >>> 15, 1 | _s);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* =====================================================================
   1. RENDU BASSE RÉSOLUTION (look PS1)
   On dessine en 360 pixels de haut, le CSS agrandit sans lisser (pixelated).
   ===================================================================== */
const canvas = document.getElementById('c');
const renderer = new T.WebGLRenderer({ canvas, antialias: false });
const INTERNAL_H = 360;
const FOG_COLOR = 0x07090c;

const scene = new T.Scene();
scene.background = new T.Color(FOG_COLOR);
scene.fog = new T.FogExp2(FOG_COLOR, 0.085);   // brouillard épais : on voit ~15 m

const camera = new T.PerspectiveCamera(75, 16 / 9, 0.1, 60);
camera.rotation.order = 'YXZ';                 // d'abord tourner à gauche/droite (Y), puis haut/bas (X)

function resize() {
  const w = innerWidth, h = innerHeight;
  const iw = Math.max(2, Math.round(INTERNAL_H * w / h));
  renderer.setPixelRatio(1);
  renderer.setSize(iw, INTERNAL_H, false);      // false = ne touche pas au CSS
  camera.aspect = iw / INTERNAL_H;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

/* =====================================================================
   2. TEXTURES PROCÉDURALES (dessinées par code, 64x64, pixels nets)
   ===================================================================== */
const TS = 64;
function makeTexture(painter) {
  const c = document.createElement('canvas');
  c.width = c.height = TS;
  const g = c.getContext('2d');
  const img = g.createImageData(TS, TS);
  const px = (x, y, r, gg, b) => {
    const i = (y * TS + x) * 4;
    img.data[i] = clamp(r, 0, 255); img.data[i + 1] = clamp(gg, 0, 255); img.data[i + 2] = clamp(b, 0, 255); img.data[i + 3] = 255;
  };
  painter(px);
  g.putImageData(img, 0, 0);
  const t = new T.CanvasTexture(c);
  t.magFilter = T.NearestFilter;               // pixels nets, pas de flou
  t.minFilter = T.NearestFilter;
  t.wrapS = t.wrapT = T.RepeatWrapping;
  return t;
}
const hash2 = (a, b) => { const h = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return h - Math.floor(h); };

// Briques : rangées de 8 px, briques de 16 px, une rangée sur deux décalée.
const texBrick = makeTexture(px => {
  for (let y = 0; y < TS; y++) {
    const row = Math.floor(y / 8), off = row % 2 ? 8 : 0;
    for (let x = 0; x < TS; x++) {
      const xx = (x + off) % TS, col = Math.floor(xx / 16);
      const grain = 0.8 + rnd() * 0.3;
      if (y % 8 === 0 || xx % 16 === 0) px(x, y, 30 * grain, 28 * grain, 26 * grain);   // mortier
      else { const v = hash2(col, row); px(x, y, (76 + v * 30) * grain, (33 + v * 13) * grain, (26 + v * 10) * grain); }
    }
  }
});
// Surface bruitée (asphalte, béton, rouille...) : couleur de base + taches + grain.
function noiseTexture(base, amount, blotch) {
  return makeTexture(px => {
    for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) {
      const k0 = Math.sin(x * 6.2832 * 3 / TS) + Math.sin(y * 6.2832 * 2 / TS + 1) + Math.sin((x + y) * 6.2832 * 2 / TS + 2);
      let k = 1 + k0 / 3 * blotch + (rnd() - 0.5) * 2 * amount;
      if (rnd() < 0.02) k += 0.35;               // petits éclats clairs
      px(x, y, base[0] * k, base[1] * k, base[2] * k);
    }
  });
}
const mat = (tex, shin = 0) => new T.MeshPhongMaterial({ map: tex, shininess: shin, specular: 0x111111 });
const M = {
  brick:    mat(texBrick),
  ground:   mat(noiseTexture([40, 40, 44], 0.12, 0.4), 6),
  concrete: mat(noiseTexture([66, 71, 66], 0.08, 0.5)),
  metal:    mat(noiseTexture([78, 52, 34], 0.15, 0.6)),
  trash:    mat(noiseTexture([20, 23, 20], 0.25, 0.3)),
  dark:     new T.MeshPhongMaterial({ color: 0x050507, shininess: 0 }),
  litwin:   new T.MeshBasicMaterial({ color: 0x6b5530 }),
  tv:       new T.MeshBasicMaterial({ color: 0x2c4a63 }),
};

/* =====================================================================
   3. DÉCOR : boîtes avec collisions
   Axes : X largeur, Y hauteur, Z longueur. Ruelle de z=+20 (départ) à z=-20 (fond), 4 m de large.
   ===================================================================== */
const colliders = [];   // liste de boîtes solides (pour les collisions du joueur)

// Boîte dont les UV (la répétition de texture) suivent la taille réelle : la texture ne s'étire jamais.
function boxGeo(w, h, d, tile) {
  const g = new T.BoxGeometry(w, h, d);
  const uv = g.attributes.uv;
  const dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];   // ordre des faces : +x -x +y -y +z -z
  for (let f = 0; f < 6; f++) for (let i = 0; i < 4; i++) {
    const k = f * 4 + i;
    uv.setXY(k, uv.getX(k) * dims[f][0] / tile, uv.getY(k) * dims[f][1] / tile);
  }
  return g;
}
function addBox(x, y, z, w, h, d, material, tile = 3, collide = true) {
  const m = new T.Mesh(boxGeo(w, h, d, tile), material);
  m.position.set(x, y, z);
  scene.add(m);
  if (collide) colliders.push({ minX: x - w / 2, maxX: x + w / 2, minY: y - h / 2, maxY: y + h / 2, minZ: z - d / 2, maxZ: z + d / 2 });
  return m;
}
function addBarrel(x, z) {
  const m = new T.Mesh(new T.CylinderGeometry(0.35, 0.35, 1.0, 8), M.metal);   // 8 côtés = low-poly
  m.position.set(x, 0.5, z);
  scene.add(m);
  colliders.push({ minX: x - 0.3, maxX: x + 0.3, minY: 0, maxY: 1.0, minZ: z - 0.3, maxZ: z + 0.3 });
}

function buildAlley() {
  addBox(0, -0.5, 0, 20, 1, 44, M.ground, 3, false);        // sol
  addBox(-6, 6, 0, 8, 12, 40, M.brick);                       // immeuble gauche (face intérieure : x = -2)
  addBox(6, 6, 0, 8, 12, 40, M.brick);                        // immeuble droit  (face intérieure : x = +2)
  addBox(0, 6, -21, 20, 12, 2, M.concrete);                   // mur du fond
  addBox(0, 6, 21, 20, 12, 2, M.concrete);                    // mur du départ

  // Fenêtres, portes, tuyaux sur les façades
  for (const side of [-1, 1]) {
    const wallX = 2 * side, outX = wallX - 0.04 * side;
    for (let z = -17; z <= 17; z += 4.5) {
      for (const y of [3.5, 7, 10]) {
        const r = rnd();
        if (r < 0.70) addBox(outX, y, z, 0.08, 1.4, 1.0, M.dark, 1, false);
        else if (r < 0.80) addBox(outX, y, z, 0.08, 1.4, 1.0, M.litwin, 1, false);   // fenêtre éclairée, sale
        else if (r < 0.85) addBox(outX, y, z, 0.08, 1.4, 1.0, M.tv, 1, false);       // lueur de télé
      }
      if (rnd() < 0.3) addBox(outX, 1.1, z + 1.8, 0.1, 2.2, 1.1, M.metal, 2, false); // porte
    }
    for (const pz of [-14, -3, 7, 15]) addBox(wallX - 0.15 * side, 6, pz, 0.25, 12, 0.25, M.metal, 2); // tuyaux
  }
  addBox(0, 5.0, -4, 4, 0.25, 0.3, M.metal, 2);               // poutres en travers, en hauteur
  addBox(0, 6.5, 8, 4, 0.25, 0.3, M.metal, 2);

  // Objets au sol
  addBox(1.5, 0.6, -6, 1.0, 1.2, 1.8, M.metal, 2);            // benne
  addBox(-1.4, 0.4, -2, 1.2, 0.8, 1.2, M.concrete, 2);        // caisses
  addBox(-1.5, 1.2, -2.1, 0.9, 0.8, 0.9, M.concrete, 2);
  addBarrel(-1.5, 9); addBarrel(-0.9, 9.8);
  addBox(1.0, 0.6, -12, 2.0, 1.2, 0.6, M.concrete, 2);        // muret à sauter
  addBox(-1.6, 0.2, -15, 0.6, 0.4, 0.5, M.trash, 1);          // sacs-poubelle
  addBox(-1.2, 0.15, -15.6, 0.5, 0.3, 0.4, M.trash, 1);
  addBox(1.6, 0.2, 4, 0.6, 0.4, 0.5, M.trash, 1);
}

/* =====================================================================
   4. NÉONS QUI GRÉSILLENT
   Chaque néon = une enseigne (texture de texte) + une lumière + un bourdonnement sonore.
   ===================================================================== */
const neons = [];
function signTexture(text, color) {
  const c = document.createElement('canvas'); c.width = 128; c.height = 32;
  const g = c.getContext('2d');
  g.fillStyle = '#0a0a0c'; g.fillRect(0, 0, 128, 32);
  g.strokeStyle = color; g.lineWidth = 2; g.strokeRect(2, 2, 124, 28);
  g.fillStyle = color; g.font = 'bold 22px "DejaVu Sans", Arial, sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, 64, 17);
  const t = new T.CanvasTexture(c); t.magFilter = T.NearestFilter; t.minFilter = T.NearestFilter;
  return t;
}
// opts: pos, rotY, size, text, color, light[x,y,z], I (intensité), rate (fréquence des pannes), hum (Hz)
function addNeon(o) {
  const material = new T.MeshBasicMaterial({ map: o.text ? signTexture(o.text, o.color) : null, color: 0xffffff, side: T.DoubleSide });
  if (!o.text) material.color.set(o.color);
  const mesh = new T.Mesh(new T.PlaneGeometry(o.size[0], o.size[1]), material);
  mesh.position.set(...o.pos); mesh.rotation.y = o.rotY || 0;
  scene.add(mesh);
  const light = new T.PointLight(o.color, o.I, 11, 2);
  light.position.set(...o.light);
  scene.add(light);
  const n = { ...o, mesh, material, light, level: 1, cur: 1, burst: 0, blink: 0, dead: false, phase: Math.random() * 10, base: new T.Color(o.color) };
  neons.push(n);
  return n;
}
function buildNeons() {
  // 0 : enseigne d'hôtel perpendiculaire au mur, côté gauche, près du départ
  addNeon({ pos: [-1.35, 3.6, 12], rotY: 0, size: [1.4, 0.55], text: 'ОТЕЛЬ', color: '#ff2a6d', light: [-1.0, 3.4, 11.2], I: 1.7, rate: 0.25, hum: 100 });
  // 1 : enseigne plate sur le mur droit
  addNeon({ pos: [1.96, 3.0, 2.5], rotY: -Math.PI / 2, size: [2.0, 0.65], text: 'TABAC', color: '#05d9e8', light: [1.3, 3.0, 2.5], I: 1.4, rate: 0.15, hum: 120 });
  // 2 : pharmacie verte, mur gauche, juste au-dessus du corps. Celle qui mourra.
  addNeon({ pos: [-1.96, 2.7, -8.5], rotY: Math.PI / 2, size: [1.7, 0.6], text: 'АПТЕКА', color: '#3dff7a', light: [-1.2, 2.5, -9.3], I: 1.5, rate: 0.5, hum: 90 });
  // 3 : "sortie" rouge au fond, qui se meurt
  addNeon({ pos: [0, 2.4, -19.93], rotY: 0, size: [1.6, 0.5], text: 'ВЫХОД', color: '#ff2020', light: [0, 2.2, -19.0], I: 1.1, rate: 0.9, hum: 110 });
  // 4 : tube blanc-bleu sur le mur droit, mauvais contact
  addNeon({ pos: [1.92, 2.8, -14], rotY: -Math.PI / 2, size: [1.2, 0.07], text: null, color: '#cfe6ff', light: [1.2, 2.7, -14], I: 1.0, rate: 1.3, hum: 130 });
}
function updateNeons(dt, time) {
  for (const n of neons) {
    if (n.dead) { n.level = 0; }
    else {
      if (n.burst > 0) {                       // pendant une "panne" : clignotement rapide et irrégulier
        n.burst -= dt; n.blink -= dt;
        if (n.blink <= 0) { n.blink = 0.03 + Math.random() * 0.06; n.cur = Math.random() < 0.55 ? 0.03 + Math.random() * 0.2 : 0.6 + Math.random() * 0.4; }
        if (n.burst <= 0) n.cur = 1;
      } else if (Math.random() < n.rate * dt) { n.burst = 0.08 + Math.random() * 0.45; n.blink = 0; }
      n.level = n.cur * (0.93 + 0.07 * Math.sin(time * 55 + n.phase));   // léger tremblement permanent
    }
    // Enseigne : la texture est assombrie quand le néon faiblit. Tube : on module sa couleur.
    if (n.text) n.material.color.setScalar(0.08 + 0.92 * n.level);
    else n.material.color.copy(n.base).multiplyScalar(0.06 + 0.94 * n.level);
    n.light.intensity = n.I * n.level;
  }
}

/* =====================================================================
   5. LE CORPS (et ce qu'il tient)
   Retenue : un homme au sol, une flaque, un détail qui raconte. Pas de spectacle.
   ===================================================================== */
const BODY = new T.Vector3(-1.0, 0, -10.5);
let silhouette = null;
function buildBody() {
  const g = new T.Group(); g.position.copy(BODY); g.rotation.y = 0.1;
  const dk = (c) => new T.MeshPhongMaterial({ color: c, shininess: 0 });
  const part = (w, h, d, x, y, z, color, ry = 0) => {
    const m = new T.Mesh(new T.BoxGeometry(w, h, d), dk(color));
    m.position.set(x, y, z); m.rotation.y = ry; g.add(m); return m;
  };
  // Flaque de sang : disque plat à peine au-dessus du sol, brillant comme du liquide
  const pool = new T.Mesh(new T.CircleGeometry(0.85, 9),
    new T.MeshPhongMaterial({ color: 0x2b0707, shininess: 40, specular: 0x552222 }));
  pool.rotation.x = -Math.PI / 2; pool.position.set(0.05, 0.012, -0.1); pool.scale.set(1.25, 1, 1); g.add(pool);
  const smear = new T.Mesh(new T.PlaneGeometry(0.28, 1.3), pool.material);   // traînée vers le mur : il a rampé
  smear.rotation.x = -Math.PI / 2; smear.rotation.z = 0.25; smear.position.set(-0.5, 0.014, -0.6); g.add(smear);
  part(0.52, 0.24, 0.68, 0, 0.13, 0, 0x1b1d22);                 // torse (veste)
  part(0.24, 0.22, 0.24, 0.03, 0.12, -0.55, 0x6a5d57);          // tête
  part(0.2, 0.19, 0.78, -0.14, 0.1, 0.88, 0x15161a, 0.1);       // jambes
  part(0.2, 0.19, 0.78, 0.16, 0.1, 0.83, 0x15161a, -0.35);
  part(0.22, 0.13, 0.32, -0.19, 0.07, 1.34, 0x0b0b0d, 0.1);     // chaussures
  part(0.22, 0.13, 0.32, 0.33, 0.07, 1.25, 0x0b0b0d, -0.35);
  part(0.15, 0.13, 0.62, 0.5, 0.08, -0.35, 0x1b1d22, 0.55);     // bras tendu vers la ruelle
  part(0.15, 0.13, 0.5, -0.36, 0.08, 0.1, 0x1b1d22, -0.2);      // bras replié
  // Une vieille clé USB, tombée près de la main tendue. Rien d'autre.
  const usb = part(0.05, 0.02, 0.14, 0.9, 0.025, -0.65, 0x8c98a4, 0.4);
  usb.material = new T.MeshBasicMaterial({ color: 0x6f7b88 });
  scene.add(g);

  // La silhouette qui n'est pas censée être là (visible seulement après la scène de peur)
  silhouette = new T.Group();
  const sm = new T.MeshBasicMaterial({ color: 0x000000 });
  const sp = (w, h, d, x, y, z) => { const m = new T.Mesh(new T.BoxGeometry(w, h, d), sm); m.position.set(x, y, z); silhouette.add(m); };
  sp(0.5, 0.8, 0.28, 0, 1.25, 0); sp(0.22, 0.24, 0.22, 0, 1.82, 0); sp(0.2, 0.85, 0.22, -0.13, 0.42, 0); sp(0.2, 0.85, 0.22, 0.13, 0.42, 0);
  silhouette.position.set(0.3, 0, -17.2);
  silhouette.visible = false;
  scene.add(silhouette);
}

/* =====================================================================
   6. SON : tout est généré par code (Web Audio). Aucun fichier.
   ===================================================================== */
let ac = null, master, musicBus, ambBus, sfxBus, reverb, noiseBuf, breathGain, tensionGain;
const hums = [];                       // un bourdonnement par néon (positionnel)
let musicOn = true;

function initAudio() {
  if (ac) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  ac = new AC();
  master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
  musicBus = ac.createGain(); musicBus.gain.value = 0.5; musicBus.connect(master);
  ambBus = ac.createGain(); ambBus.gain.value = 1; ambBus.connect(master);
  sfxBus = ac.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);

  // Bruit blanc de 2 s, réutilisé partout (vent, pas, respiration)
  noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

  // Réverbération : écho de ruelle (réponse impulsionnelle = bruit qui s'éteint)
  const len = ac.sampleRate * 2.6, ir = ac.createBuffer(2, len, ac.sampleRate);
  for (let c = 0; c < 2; c++) { const ch = ir.getChannelData(c); for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
  reverb = ac.createConvolver(); reverb.buffer = ir;
  const rg = ac.createGain(); rg.gain.value = 0.55; reverb.connect(rg); rg.connect(master);

  startWind(); startDrone(); startBreath(); startNeonHums();
  scheduleMusic(); scheduleSiren(14000);
}
function noiseSource(loop) { const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = loop; return s; }

// Vent : bruit filtré, dont le volume ondule lentement
function startWind() {
  const s = noiseSource(true); s.start();
  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 280; f.Q.value = 0.7;
  const g = ac.createGain(); g.gain.value = 0.05;
  const lfo = ac.createOscillator(); lfo.frequency.value = 0.07;
  const lg = ac.createGain(); lg.gain.value = 0.03; lfo.connect(lg); lg.connect(g.gain); lfo.start();
  s.connect(f); f.connect(g); g.connect(ambBus);
}
// Drone grave permanent + couche de tension (triton) qui monte quand on s'enfonce dans la ruelle
function startDrone() {
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 160;
  const g = ac.createGain(); g.gain.value = 0.16;
  for (const hz of [41, 41.7, 82.2]) { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = hz; o.connect(f); o.start(); }
  f.connect(g); g.connect(ambBus);
  tensionGain = ac.createGain(); tensionGain.gain.value = 0;
  const tf = ac.createBiquadFilter(); tf.type = 'lowpass'; tf.frequency.value = 500;
  for (const hz of [110, 155.6]) { const o = ac.createOscillator(); o.type = 'triangle'; o.frequency.value = hz; o.connect(tf); o.start(); }
  tf.connect(tensionGain); tensionGain.connect(musicBus);
}
// Respiration : bruit filtré dont l'amplitude suit un cycle, plus rapide et plus fort après un sprint
function startBreath() {
  const s = noiseSource(true); s.start();
  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 850; f.Q.value = 0.9;
  breathGain = ac.createGain(); breathGain.gain.value = 0;
  s.connect(f); f.connect(breathGain); breathGain.connect(sfxBus);
}
// Bourdonnement de chaque néon : son 3D, il vient bien de l'enseigne
function startNeonHums() {
  for (const n of neons) {
    const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = n.hum;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420;
    const g = ac.createGain(); g.gain.value = 0;
    const p = ac.createPanner(); p.panningModel = 'HRTF'; p.refDistance = 1.5; p.rolloffFactor = 1.4;
    p.positionX.value = n.pos[0]; p.positionY.value = n.pos[1]; p.positionZ.value = n.pos[2];
    o.connect(f); f.connect(g); g.connect(p); p.connect(ambBus); o.start();
    hums.push({ n, g });
  }
}
// Musique générative : notes lentes, graves, dans une gamme mineure, noyées dans l'écho
const SCALE = [110, 130.8, 146.8, 164.8, 196, 220, 261.6];
function scheduleMusic() {
  if (!ac) return;
  if (musicOn) {
    const hz = SCALE[Math.floor(Math.random() * SCALE.length)] / (Math.random() < 0.4 ? 2 : 1);
    pad(hz, 0.05, 4, 7);
    if (Math.random() < 0.35) pad(hz * 3, 0.012, 2, 6);               // harmonique fine, lointaine
  }
  setTimeout(scheduleMusic, 4500 + Math.random() * 4500);
}
function pad(hz, vol, attack, release) {
  const t = ac.currentTime;
  const g = ac.createGain(); g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + attack); g.gain.linearRampToValueAtTime(0, t + attack + release);
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 700;
  for (const det of [-4, 4]) { const o = ac.createOscillator(); o.type = 'triangle'; o.frequency.value = hz; o.detune.value = det; o.connect(f); o.start(t); o.stop(t + attack + release + 0.2); }
  f.connect(g); g.connect(musicBus); g.connect(reverb);
}
// Sirène lointaine : sinus qui oscille, filtré, panoramique aléatoire, dans l'écho
function scheduleSiren(delay) {
  setTimeout(() => {
    if (ac) {
      const t = ac.currentTime, o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = 620;
      const l = ac.createOscillator(); l.frequency.value = 0.4; const lg = ac.createGain(); lg.gain.value = 130; l.connect(lg); lg.connect(o.frequency);
      const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 800;
      const g = ac.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.035, t + 3); g.gain.setValueAtTime(0.035, t + 10); g.gain.linearRampToValueAtTime(0, t + 15);
      const pan = ac.createStereoPanner(); pan.pan.value = Math.random() * 1.6 - 0.8;
      o.connect(f); f.connect(g); g.connect(pan); pan.connect(ambBus); pan.connect(reverb);
      o.start(t); l.start(t); o.stop(t + 15.5); l.stop(t + 15.5);
    }
    scheduleSiren(28000 + Math.random() * 30000);
  }, delay);
}
// Bruit de pas : un souffle de bruit grave très court + un petit "toc"
function footstep(sprint) {
  if (!ac) return;
  const t = ac.currentTime, s = noiseSource(false);
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 260 + Math.random() * 260;
  const g = ac.createGain(), v = sprint ? 0.55 : 0.3;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.008); g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  s.connect(f); f.connect(g); g.connect(sfxBus); g.connect(reverb); s.start(t, Math.random() * 1.5, 0.14);
}
function thud(vol, hz = 60, dur = 0.35) {
  if (!ac) return;
  const t = ac.currentTime, o = ac.createOscillator(); o.frequency.setValueAtTime(hz * 2, t); o.frequency.exponentialRampToValueAtTime(hz, t + 0.12);
  const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(sfxBus); g.connect(reverb); o.start(t); o.stop(t + dur + 0.05);
}
function clang() {   // bruit métallique lointain, dans l'écho
  if (!ac) return;
  const t = ac.currentTime, s = noiseSource(false);
  const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1700; f.Q.value = 6;
  const g = ac.createGain(); g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
  s.connect(f); f.connect(g); g.connect(reverb); g.connect(sfxBus); s.start(t, 0.3, 1.2);
}

/* =====================================================================
   7. JOUEUR : déplacement, collisions
   ===================================================================== */
const P = { pos: new T.Vector3(0, 0, 17), vx: 0, vz: 0, vy: 0, yaw: 0, pitch: 0, onGround: true, bob: 0, stepDist: 0, exert: 0, breathPhase: 0 };
const R = 0.35, HEIGHT = 1.75, GRAVITY = 20, JUMP = 7.4, WALK = 3.5, RUN = 7.5;
const keys = {};

// Renvoie la boîte touchée à cette position, ou null
function hit(x, y, z) {
  for (const b of colliders) {
    if (x + R > b.minX && x - R < b.maxX && z + R > b.minZ && z - R < b.maxZ && y + HEIGHT > b.minY + 0.001 && y < b.maxY - 0.001) return b;
  }
  return null;
}
function movePlayer(dt) {
  // 1) Direction voulue, dans le sens du regard (event.code = touche physique : ZQSD et WASD marchent)
  let fx = 0, fz = 0;
  if (keys.KeyW || keys.ArrowUp) fz -= 1;
  if (keys.KeyS || keys.ArrowDown) fz += 1;
  if (keys.KeyA || keys.ArrowLeft) fx -= 1;
  if (keys.KeyD || keys.ArrowRight) fx += 1;
  const len = Math.hypot(fx, fz) || 1; fx /= len; fz /= len;
  const sin = Math.sin(P.yaw), cos = Math.cos(P.yaw);
  const wishX = fx * cos + fz * sin, wishZ = -fx * sin + fz * cos;
  const moving = (fx || fz) !== 0;
  const sprint = moving && (keys.ShiftLeft || keys.ShiftRight);
  const speed = sprint ? RUN : WALK;

  // 2) On rapproche la vitesse de la cible (démarrage et arrêt progressifs)
  const acc = Math.min(1, (P.onGround ? 11 : 2.5) * dt);
  P.vx += (wishX * speed - P.vx) * acc;
  P.vz += (wishZ * speed - P.vz) * acc;

  // 3) Saut
  if (keys.Space && P.onGround) { P.vy = JUMP; P.onGround = false; }

  // 4) Déplacement axe par axe (permet de glisser le long des murs)
  const p = P.pos;
  for (const axis of ['x', 'z']) {
    const nx = axis === 'x' ? p.x + P.vx * dt : p.x, nz = axis === 'z' ? p.z + P.vz * dt : p.z;
    const b = hit(nx, p.y, nz);
    if (!b) { p.x = nx; p.z = nz; }
    else if (b.maxY - p.y <= 0.45 && !hit(nx, b.maxY, nz)) { p.x = nx; p.z = nz; p.y = b.maxY; }   // petite marche : on monte
    else if (axis === 'x') P.vx = 0; else P.vz = 0;
  }
  // 5) Gravité et sol
  const wasAir = !P.onGround, fallSpeed = P.vy;
  P.vy -= GRAVITY * dt;
  let ny = p.y + P.vy * dt; P.onGround = false;
  const hb = hit(p.x, ny, p.z);
  if (hb) { if (P.vy <= 0) { ny = hb.maxY; P.onGround = true; } else ny = p.y; P.vy = 0; }
  if (ny <= 0) { ny = 0; P.vy = 0; P.onGround = true; }
  p.y = ny;
  if (wasAir && P.onGround && fallSpeed < -3) thud(clamp(-fallSpeed / 14, 0.1, 0.5), 70, 0.25);   // atterrissage

  // 6) Pas, balancement de la caméra, essoufflement
  const horiz = Math.hypot(P.vx, P.vz);
  if (P.onGround && horiz > 0.5) {
    P.stepDist += horiz * dt; P.bob += horiz * dt * 1.6;
    const stride = sprint ? 1.9 : 1.5;
    if (P.stepDist > stride) { P.stepDist = 0; footstep(sprint); }
  }
  P.exert = clamp(P.exert + (sprint && horiz > 3 ? 0.22 : -0.09) * dt, 0, 1);
  return horiz;
}

/* =====================================================================
   8. SCÈNE DE PEUR : le corps, la lumière qui meurt, le silence
   ===================================================================== */
const scare = { state: 0, t: 0 };   // 0 attente, 1 silence, 2 clang, 3 silhouette, 4 fini
function updateScare(dt) {
  const near = P.pos.distanceTo(BODY) < 7.5;
  if (scare.state === 0 && near) {
    scare.state = 1; scare.t = 0;
    neons[2].dead = true;                                   // l'enseigne verte au-dessus du corps s'éteint
    if (ac) { const t = ac.currentTime; for (const b of [ambBus, musicBus]) { b.gain.cancelScheduledValues(t); b.gain.setTargetAtTime(0, t, 0.06); } }   // silence soudain
    thud(0.35, 45, 0.6);
  } else if (scare.state > 0 && scare.state < 4) {
    scare.t += dt;
    if (scare.state === 1 && scare.t > 3.4) { scare.state = 2; clang(); if (silhouette) silhouette.visible = true; }
    if (scare.state === 2 && scare.t > 3.4 && ac) {         // le son revient doucement
      const t = ac.currentTime; ambBus.gain.setTargetAtTime(1, t, 1.5); musicBus.gain.setTargetAtTime(musicOn ? 0.5 : 0, t, 1.5); scare.state = 3;
    }
    // La silhouette disparaît quand on s'approche ou qu'on regarde ailleurs trop longtemps
    if (scare.state === 3 && silhouette.visible) {
      const toS = silhouette.position.clone().sub(P.pos).setY(0), dist = toS.length();
      const look = new T.Vector3(); camera.getWorldDirection(look); look.y = 0;
      if (dist < 9 || (scare.t > 9 && look.dot(toS.normalize()) < 0.3)) { silhouette.visible = false; scare.state = 4; thud(0.2, 55, 0.3); }
    }
  }
}

/* =====================================================================
   9. ENTRÉES, DÉMARRAGE, BOUCLE PRINCIPALE
   ===================================================================== */
const startEl = document.getElementById('start'), noteEl = document.getElementById('note');
let playing = false, locked = false, dragging = false, everLocked = false;

addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
  if (e.code === 'KeyM' && ac) { musicOn = !musicOn; musicBus.gain.setTargetAtTime(musicOn ? 0.5 : 0, ac.currentTime, 0.2); }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

addEventListener('mousemove', e => {
  if (!playing || !(locked || dragging)) return;            // souris verrouillée, ou clic maintenu en secours
  P.yaw -= e.movementX * 0.0022;
  P.pitch = clamp(P.pitch - e.movementY * 0.0022, -1.5, 1.5);
});
canvas.addEventListener('mousedown', () => { dragging = true; });
addEventListener('mouseup', () => { dragging = false; });

document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === canvas;
  if (locked) everLocked = true;
  else if (everLocked && playing) { playing = false; startEl.hidden = false; }   // Échap = pause
});
startEl.addEventListener('click', () => {
  initAudio(); if (ac && ac.state === 'suspended') ac.resume();
  startEl.hidden = true; playing = true; last = performance.now();
  try { const r = canvas.requestPointerLock(); if (r && r.catch) r.catch(() => { noteEl.textContent = ''; }); } catch (e) {}
});

buildAlley(); buildNeons(); buildBody();
const playerLight = new T.PointLight(0x5a6a8a, 0.5, 8, 2);   // une lueur très faible autour du joueur
scene.add(playerLight);
scene.add(new T.AmbientLight(0x2a3346, 0.6));

let last = performance.now(), time = 0;
const dir = new T.Vector3();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
  if (playing) {
    const horiz = movePlayer(dt);
    updateScare(dt);
    // Tension musicale : monte quand on s'enfonce dans la ruelle (z passe de +17 à -17)
    if (ac && tensionGain && scare.state !== 1) tensionGain.gain.setTargetAtTime(clamp((17 - P.pos.z) / 34, 0, 1) * 0.07, ac.currentTime, 0.5);
    // Respiration
    if (ac && breathGain) {
      P.breathPhase += dt * (0.28 + P.exert * 1.1) * 6.2832;
      const env = Math.pow(Math.sin(P.breathPhase) * 0.5 + 0.5, 2);
      breathGain.gain.setTargetAtTime((0.004 + P.exert * 0.09) * env, ac.currentTime, 0.05);
    }
    // Caméra : à hauteur d'yeux + léger balancement de marche
    const bobY = Math.sin(P.bob * 2) * 0.035 * clamp(horiz / 4, 0, 1.5);
    camera.position.set(P.pos.x, P.pos.y + 1.6 + bobY, P.pos.z);
    camera.rotation.set(P.pitch, P.yaw, 0);
  }
  updateNeons(dt, time);
  playerLight.position.copy(camera.position);
  // Son 3D : l'oreille suit la caméra ; chaque néon bourdonne selon son niveau de lumière
  if (ac) {
    camera.getWorldDirection(dir);
    const L = ac.listener;
    if (L.positionX) { L.positionX.value = camera.position.x; L.positionY.value = camera.position.y; L.positionZ.value = camera.position.z;
      L.forwardX.value = dir.x; L.forwardY.value = dir.y; L.forwardZ.value = dir.z; L.upX.value = 0; L.upY.value = 1; L.upZ.value = 0; }
    for (const h of hums) h.g.gain.setTargetAtTime(0.06 * h.n.level, ac.currentTime, 0.02);
  }
  renderer.render(scene, camera);
}
camera.position.set(P.pos.x, 1.6, P.pos.z);
requestAnimationFrame(frame);

// Accès pour tests/débogage depuis la console du navigateur : paris.P, paris.scare, paris.camera ...
window.paris = { P, scare, camera, neons, BODY, startNow() { startEl.click(); } };
})();
</script>
