      if (P.rollBuf > 0 && landedFall > 5.2 && P.mode === 'move') {
        const s = Math.hypot(P.vx, P.vz), dx = s > 0.5 ? P.vx / s : -Math.sin(P.yaw), dz = s > 0.5 ? P.vz / s : -Math.cos(P.yaw), keep = Math.max(s, 5.2);
        P.vx = dx * keep; P.vz = dz * keep; P.mode = 'roll'; P.rollT = 0.62; P.dip = 0.05; snd('thud', 0.25, 70, 0.3);
      } else if (landedFall > 18) { P.stunT = 1.2; P.vx *= 0.15; P.vz *= 0.15; P.dip = 0.4; snd('thud', 0.6, 50, 0.5); }
      else if (landedFall > 13.5) { P.stunT = 0.45; P.vx *= 0.5; P.vz *= 0.5; P.dip = 0.26; snd('thud', 0.4, 60, 0.4); }
      else { P.dip = G.clamp(landedFall / 60, 0.03, 0.2); snd('thud', G.clamp(landedFall / 14, 0.1, 0.5), 70, 0.25); }
    }

    // --- Pas, essoufflement ---
    const horiz = Math.hypot(P.vx, P.vz); P.speed = horiz;
    if (P.onGround && horiz > 0.4 && P.mode !== 'slide' && P.mode !== 'roll') {
      P.stepDist += horiz * dt;
      const stride = P.sprint ? 1.55 : 0.8, n = Math.floor(P.stepDist / stride);
      if (n > P.lastStep) snd('footstep', P.sprint, G.zoneAt(p));
      P.lastStep = n;
    }
    P.exert = G.clamp(P.exert + (P.sprint && horiz > 3 ? 0.2 : P.mode === 'slide' ? 0.05 : -0.07) * dt, 0, 1);
    P.lean = G.lerp(P.lean, fx * G.clamp(horiz / RUN, 0, 1), Math.min(1, dt * 8));
    snapPrev();
    return horiz;
  };
  function snapPrev() { for (const c of ['Space', 'KeyC', 'KeyF']) prev[c] = !!G.keys[c]; }

  /* ---------- Caméra : yeux, balancement, inclinaison, roulade, creux, champ de vision ---------- */
  G.updateCamera = function (dt, time) {
    const P = G.P, cam = G.camera, horiz = Math.hypot(P.vx, P.vz);
    const eyeH = EYE * (P.h / H_STAND) * 0.97 + 0.03;
    const rate = P.onGround ? 15 : 70;                                              // lisse les marches d'escalier
    P.eye += (P.pos.y + eyeH - P.eye) * Math.min(1, rate * dt);
    P.dip = Math.max(0, P.dip - dt * 0.55);
    const grounded = P.onGround && P.mode !== 'slide' && P.mode !== 'roll' && !P.anim;
    P.bobAmp = G.lerp(P.bobAmp, grounded ? G.clamp(horiz / RUN, 0, 1) : 0, Math.min(1, dt * 6));
    const stride = P.sprint ? 1.55 : 0.8, phase = P.stepDist / stride * Math.PI, run = P.sprint ? 1 : 0.4;
    const bobY = Math.abs(Math.sin(phase)) * (0.035 + run * 0.05) * P.bobAmp;
    const bobX = Math.sin(phase) * (0.02 + run * 0.025) * P.bobAmp;
    let rollT = Math.sin(phase) * (0.006 + run * 0.012) * P.bobAmp - P.lean * 0.035 + P.animRoll;      // inclinaison cible
    if (P.mode === 'wallrun') rollT += P.wallSide * 0.26 * (P.wallT < 0.9 ? 1 : 0.5 + 0.5 * Math.sin(time * 40)) ;
    if (P.mode === 'slide') rollT += 0.06; if (P.stunT > 0) rollT += Math.sin(time * 30) * 0.03;
    P.camRoll = G.lerp(P.camRoll, rollT, Math.min(1, dt * 12));
    let spin = 0; if (P.mode === 'roll') { const u = 1 - G.clamp(P.rollT / 0.62, 0, 1); spin = -Math.PI * 2 * ease(u); }   // la roulade
    const breath = Math.sin(time * 1.1) * 0.004 * (1 + P.exert * 2.5);
    const dip = P.dip + P.animDip + (P.mode === 'slide' ? 0.0 : 0);
    cam.position.set(P.pos.x + Math.cos(P.yaw) * bobX, P.eye + bobY + breath - dip, P.pos.z - Math.sin(P.yaw) * bobX);
    cam.rotation.set(P.pitch + P.animPitch + spin - bobY * 0.12, P.yaw, P.camRoll);
    P.fovKick = Math.max(0, P.fovKick - dt * 28);
    const fovT = 70 + (P.sprint ? 6 : 0) * P.bobAmp + P.fovKick + (P.mode === 'slide' ? 5 : 0) + (P.mode === 'wallrun' ? 4 : 0);
    if (Math.abs(cam.fov - fovT) > 0.05) { cam.fov += (fovT - cam.fov) * Math.min(1, dt * 9); cam.updateProjectionMatrix(); }
  };

  G.loaded.push('player');
})();

</script>
<script>
/* ---- js/audio.js ---- */
/* =====================================================================
   audio.js : lit TES fichiers sons (plus aucun son généré par code).
   - audio/music/*            : musique du jeu, jouée en boucle aléatoire avec fondu.
   - audio/fx/<element>/*     : un dossier par élément (pas, saut, ambiance...). S'il y a plusieurs
                                fichiers dans un dossier, le jeu en choisit un au hasard à chaque fois.
   La liste des fichiers vient de audio/manifest.json, créé par serve.py / build.py (voir audio/README.md).
   Dossier vide ou absent = silence, sans erreur.
   ===================================================================== */
(function () {
  'use strict';
  const G = window.G;
  let ac = null, master, musicBus, fxBus, manifest = { music: [], fx: {} };
  const buf = {};                 // dossier -> liste de sons décodés
  const loops = {};               // sons qui bouclent (ambiances, respiration, écran)
  let musicOn = true, curMusic = null, lastZone = 'in';

  // Ces fonctions ne font rien tant que l'audio n'est pas démarré (il faut d'abord un clic du joueur)
  const A = G.audio = { footstep() {}, thud() {}, jump() {}, flick() {}, update() {} };

  A.init = async function () {
    if (ac) return;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC(); A.ctx = ac;
    master = ac.createGain(); master.gain.value = G.settings.volume; master.connect(ac.destination);
    musicBus = ac.createGain(); musicBus.gain.value = G.settings.music; musicBus.connect(master);
    fxBus = ac.createGain(); fxBus.gain.value = G.settings.fx; fxBus.connect(master);
    A.footstep = footstep; A.thud = land; A.jump = jump; A.flick = pickup; A.update = update;
    if (location.protocol === 'file:') console.info('[audio] page ouverte en double-clic : le navigateur bloque les fichiers sons. Lance jouer.bat (ou python3 serve.py), voir audio/README.md.');
    else { try { const r = await fetch('audio/manifest.json', { cache: 'no-store' }); if (r.ok) manifest = await r.json(); } catch (e) { /* pas de sons : silence */ } }
    for (const folder in manifest.fx || {}) {            // charge et décode chaque fichier de chaque dossier
      buf[folder] = [];
      for (const url of manifest.fx[folder]) {
        try { buf[folder].push(await ac.decodeAudioData(await (await fetch(url)).arrayBuffer())); }
        catch (e) { console.warn('[audio] fichier illisible :', url); }
      }
    }
    startLoops(); startMusic(); scheduleSiren(40000);
  };
  A.suspend = () => { if (ac && ac.state === 'running') { ac.suspend(); if (curMusic) curMusic.pause(); } };
  A.resume = () => { if (ac && ac.state === 'suspended') { ac.resume(); if (curMusic) curMusic.play().catch(() => {}); } };
  A.toggleMusic = () => { musicOn = !musicOn; if (ac) musicBus.gain.setTargetAtTime(musicOn ? G.settings.music : 0, ac.currentTime, 0.2); };
  A.setVolume = v => { if (ac) master.gain.setTargetAtTime(v, ac.currentTime, 0.1); };

  // Joue un fichier au hasard du dossier (légère variation de hauteur pour éviter la répétition)
  function play(folder, vol) {
    const list = buf[folder]; if (!list || !list.length) return null;
    const s = ac.createBufferSource(); s.buffer = list[Math.floor(Math.random() * list.length)];
    s.playbackRate.value = 1 + (Math.random() - 0.5) * 0.1;
    const g = ac.createGain(); g.gain.value = vol == null ? 1 : vol; s.connect(g); g.connect(fxBus); s.start(); return s;
  }
  // Son qui boucle, dont on règle ensuite le volume (gain.g)
  function makeLoop(folder, dest) {
    const list = buf[folder]; if (!list || !list.length) return null;
    const s = ac.createBufferSource(); s.buffer = list[0]; s.loop = true;
    const g = ac.createGain(); g.gain.value = 0; s.connect(g); g.connect(dest || fxBus); s.start(); return { g };
  }
  function startLoops() {
    loops.inside = makeLoop('ambience_inside'); loops.outside = makeLoop('ambience_outside');
    loops.breathIdle = makeLoop('breath_idle'); loops.breathRun = makeLoop('breath_run');
    const p = ac.createPanner(); p.panningModel = 'HRTF'; p.refDistance = 1; p.rolloffFactor = 1.6;   // l'écran : son placé dans la pièce
    if (G.crtPos) { p.positionX.value = G.crtPos.x; p.positionY.value = G.crtPos.y; p.positionZ.value = G.crtPos.z; }
    p.connect(fxBus); loops.crt = makeLoop('crt', p);
  }
  // Musique : lecture en flux (fichiers longs OK), ordre aléatoire, fondu à l'entrée
  function startMusic() {
    const tracks = (manifest.music || []).slice().sort(() => Math.random() - 0.5); if (!tracks.length) return;
    let i = 0;
    (function next() {
      const el = new Audio(); el.crossOrigin = 'anonymous'; el.src = tracks[i++ % tracks.length]; curMusic = el;
      const g = ac.createGain(); g.gain.value = 0; ac.createMediaElementSource(el).connect(g); g.connect(musicBus);
      g.gain.linearRampToValueAtTime(1, ac.currentTime + 4);
      el.addEventListener('ended', () => { g.disconnect(); next(); });
      el.play().catch(() => {});
    })();
  }
  function scheduleSiren(delay) {
    setTimeout(() => { if (buf.siren && buf.siren.length) play('siren', lastZone === 'in' ? 0.3 : 0.7); scheduleSiren(40000 + Math.random() * 50000); }, delay);
  }

  // --- Événements du jeu -> dossiers de sons ---
  function footstep(sprint, zone) { play(sprint && buf.footsteps_run && buf.footsteps_run.length ? 'footsteps_run' : 'footsteps', sprint ? 1 : 0.8); }
  function land(vol) { play('land', Math.min(1, vol * 2)); }
  function jump() { play('jump', 0.9); }
  function pickup() { play('lighter', 1); }

  // À chaque image : ambiance selon le lieu, respiration selon l'effort, "oreille" placée sur la caméra
  function update(dt, cam, dir, zone, exert) {
    const t = ac.currentTime; lastZone = zone;
    if (loops.inside) loops.inside.g.gain.setTargetAtTime(zone === 'in' ? 1 : 0, t, 0.6);
    if (loops.outside) loops.outside.g.gain.setTargetAtTime(zone === 'in' ? 0 : 1, t, 0.6);
    if (loops.crt) loops.crt.g.gain.setTargetAtTime(1, t, 0.2);
    if (loops.breathIdle) loops.breathIdle.g.gain.setTargetAtTime(0.6 * (1 - exert), t, 0.4);
    if (loops.breathRun) loops.breathRun.g.gain.setTargetAtTime(exert, t, 0.4);
    const L = ac.listener;
    if (L.positionX) {
      L.positionX.value = cam.x; L.positionY.value = cam.y; L.positionZ.value = cam.z;
      L.forwardX.value = dir.x; L.forwardY.value = dir.y; L.forwardZ.value = dir.z; L.upX.value = 0; L.upY.value = 1; L.upZ.value = 0;
    }
  }

  G.loaded.push('audio');
})();

</script>
<script>
/* ---- js/game.js ---- */
/* =====================================================================
   game.js : le chef d'orchestre. Démarrage, boucle principale, souris/clavier, interactions, intro.
   L'ordre à chaque image : joueur -> caméra -> animations -> lumières -> son -> dessin.
   ===================================================================== */
(function () {
  'use strict';
  const G = window.G, T = G.T;
  const el = id => document.getElementById(id);
  let playing = false, started = false, locked = false, dragging = false, everLocked = false, last = 0, time = 0, canvasEl = null;
  const fwd = new T.Vector3();

  // Texte discret en bas de l'écran (pas d'interface lourde)
  G.say = function (text, ms) {
    const c = el('caption'); c.textContent = text; c.style.opacity = 1;
    clearTimeout(G._sayT); G._sayT = setTimeout(() => { c.style.opacity = 0; }, ms || 5000);
  };

  // Construit le monde pas à pas (progress sert à la barre de chargement du menu)
  G.boot = async function (canvas, progress) {
    const tick = () => new Promise(r => setTimeout(r, 20));
    canvasEl = canvas;
    G.loadSettings();
    progress(0.05, 'Rendu'); G.initRender(canvas); await tick();
    progress(0.2, 'Matières : béton, rouille, asphalte'); G.buildMaterials(); await tick();
    progress(0.5, 'Immeuble, escalier, rue'); G.buildWorld(); await tick();
    progress(0.9, 'Joueur'); G.initPlayer(); G.updateLamps(0, 0); G.render(0);
    progress(1, 'Prêt');
    last = performance.now(); requestAnimationFrame(loop);
    bindInput();
  };

  // Appelé quand le joueur clique pour entrer (ou reprendre après une pause)
  G.start = function () {
    G.audio.init(); G.audio.resume();
    playing = true; last = performance.now();
    try { const r = canvasEl.requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch (e) { /* tant pis : clic maintenu pour tourner */ }
    if (!started) { started = true; intro(); }
  };

  // Début calme : écran noir, le titre, puis on ouvre les yeux dans le studio
  function intro() {
    const f = el('fade'), t = el('title');
    f.style.transition = 'none'; f.style.opacity = 1; t.style.opacity = 0;
    setTimeout(() => { t.style.transition = 'opacity 2s'; t.style.opacity = 1; }, 300);
    setTimeout(() => { t.style.opacity = 0; }, 3400);
    setTimeout(() => { f.style.transition = 'opacity 5s ease-out'; f.style.opacity = 0; }, 4200);
    setTimeout(() => { const h = el('hint'); h.style.opacity = 1; setTimeout(() => { h.style.opacity = 0; }, 9000); }, 9500);
  }

  function pause() {
    playing = false; G.audio.suspend();
    el('enter-text').textContent = 'PAUSE'; el('enter-sub').textContent = 'cliquer pour reprendre'; el('enter').hidden = false;
  }

  function bindInput() {
    addEventListener('keydown', e => {
      G.keys[e.code] = true;
      if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
      if (e.key && e.key.toLowerCase() === 'm') G.audio.toggleMusic();   // la lettre M, quelle que soit la disposition du clavier
      if (e.code === 'KeyE' && playing && G.focus) G.focus.use();
    });
    addEventListener('keyup', e => { G.keys[e.code] = false; });
    addEventListener('blur', () => { for (const k in G.keys) G.keys[k] = false; });
    addEventListener('mousemove', e => {
      if (!playing || !(locked || dragging)) return;
      const s = 0.0022 * G.settings.sens;
      G.P.yaw -= e.movementX * s; G.P.pitch = G.clamp(G.P.pitch - e.movementY * s, -1.5, 1.5);
    });
    canvasEl.addEventListener('mousedown', () => { dragging = true; });
    addEventListener('mouseup', () => { dragging = false; });
    document.addEventListener('pointerlockchange', () => {
      locked = document.pointerLockElement === canvasEl;
      if (locked) everLocked = true; else if (everLocked && playing) pause();     // Échap = pause
    });
  }

  // Quel objet le joueur regarde-t-il, de près ? (une seule indication discrète à l'écran)
  function updateInteract() {
    const cam = G.camera; cam.getWorldDirection(fwd);
    let best = null, bd = 1e9;
    for (const it of G.interactables) {
      const to = it.pos.clone().sub(cam.position), d = to.length();
      if (d < it.radius && to.normalize().dot(fwd) > 0.82 && d < bd) { best = it; bd = d; }
    }
    G.focus = best;
    const pr = el('prompt'); pr.textContent = best ? '[E]  ' + best.prompt : ''; pr.style.opacity = best ? 1 : 0;
  }

  function loop(now) {
    requestAnimationFrame(loop);
    const dt = G.clamp((now - last) / 1000, 0, 0.05); last = now; time += dt;   // jamais négatif ni trop grand
    if (playing) { G.updatePlayer(dt); updateInteract(); }
    G.updateCamera(dt, time);
    for (const a of G.animated) a.update(dt);
    G.updateLamps(dt, time);
    const zone = G.zoneAt(G.P.pos);
    G.scene.fog.density += ((zone === 'in' ? 0.04 : zone === 'field' ? 0.075 : 0.09) - G.scene.fog.density) * Math.min(1, dt * 1.5);   // plus clair dans l'immeuble
    if (playing) { G.camera.getWorldDirection(fwd); G.audio.update(dt, G.camera.position, fwd, zone, G.P.exert); }
    G.render(time);
  }

  G.loaded.push('game');
})();

</script>

<script>
/* =====================================================================
   Menu + chargeur. Le jeu complet (dossier js/) ne se charge qu'après "JOUER".
   (Dans la version "tout-en-un" publiée en ligne, les fichiers sont déjà inclus : on saute le téléchargement.)
   ===================================================================== */
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const FILES = ['core', 'render', 'textures', 'physics', 'world', 'city', 'player', 'audio', 'game'];
  const S = { quality: 'medium', sens: 1, volume: 0.9, music: 0.6, fx: 0.9 };
  try { Object.assign(S, JSON.parse(localStorage.getItem('paris2193') || '{}')); } catch (e) { /* pas grave */ }
  const save = () => { try { localStorage.setItem('paris2193', JSON.stringify(S)); } catch (e) { /* pas grave */ } };
  const show = id => { for (const p of ['p-main', 'p-opt', 'p-load']) $(p).hidden = p !== id; };

  // --- Grain animé du fond du menu ---
  const gc = $('grain'), gx = gc.getContext('2d'), gi = gx.createImageData(160, 90);
  const grainTimer = setInterval(() => { for (let i = 0; i < gi.data.length; i += 4) { const v = Math.random() * 255; gi.data[i] = gi.data[i + 1] = gi.data[i + 2] = v; gi.data[i + 3] = 255; } gx.putImageData(gi, 0, 0); }, 110);

  // --- Options ---
  function refreshOpt() {
    document.querySelectorAll('[data-q]').forEach(b => b.classList.toggle('on', b.dataset.q === S.quality));
    $('o-sens').value = S.sens; $('o-vol').value = S.volume; $('o-music').value = S.music; $('o-fx').value = S.fx;
  }
  document.querySelectorAll('[data-q]').forEach(b => b.addEventListener('click', () => { S.quality = b.dataset.q; save(); refreshOpt(); }));
  $('o-sens').addEventListener('input', e => { S.sens = +e.target.value; save(); });
  $('o-vol').addEventListener('input', e => { S.volume = +e.target.value; save(); });
  $('o-music').addEventListener('input', e => { S.music = +e.target.value; save(); });
  $('o-fx').addEventListener('input', e => { S.fx = +e.target.value; save(); });
  $('b-opt').addEventListener('click', () => { refreshOpt(); show('p-opt'); });
  $('b-back').addEventListener('click', () => show('p-main'));

  // --- Chargement des fichiers puis construction du monde ---
  const loadScript = src => new Promise((ok, ko) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => ko(new Error('Fichier introuvable : ' + src)); document.head.appendChild(s); });
  function setBar(p, msg) { $('bar').firstElementChild.style.width = Math.round(p * 100) + '%'; if (msg) $('loadmsg').textContent = msg; }

  let busy = false;
  $('b-play').addEventListener('click', async () => {
    if (busy) return; busy = true; show('p-load'); setBar(0.02, 'Chargement du code');
    try {
      for (let i = 0; i < FILES.length; i++) {
        if (!G.loaded.includes(FILES[i])) await loadScript('js/' + FILES[i] + '.js');
        setBar(0.02 + 0.3 * (i + 1) / FILES.length, 'js/' + FILES[i] + '.js');
      }
      await G.boot($('game'), (p, msg) => setBar(0.32 + 0.68 * p, msg));
      clearInterval(grainTimer);
      $('menu').hidden = true; $('enter-text').textContent = 'PARIS 2193'; $('enter').hidden = false;
    } catch (err) {
      busy = false; $('loadmsg').textContent = 'Erreur : ' + err.message + ' (ouvre la console F12 pour le détail)'; console.error(err);
    }
  });
  $('enter').addEventListener('click', () => { $('enter').hidden = true; G.start(); });
})();
</script>
