<style>

<script>
/* ---- js/core.js ---- */
/* =====================================================================
   core.js : outils partagés (réglages, aléatoire, bruit).
   Tous les fichiers du jeu partagent un seul objet global : G.
   Chaque fichier ajoute ses fonctions à G, rien ne s'exécute avant G.boot().
   ===================================================================== */
(function () {
  'use strict';
  const G = window.G = window.G || { loaded: [] };
  G.T = window.THREE;

  // --- Réglages du joueur (sauvegardés dans le navigateur si possible) ---
  G.settings = { quality: 'medium', sens: 1, volume: 0.9, music: 0.6, fx: 0.9 };
  G.loadSettings = function () {
    try { Object.assign(G.settings, JSON.parse(localStorage.getItem('paris2193') || '{}')); } catch (e) { /* pas grave */ }
  };
  G.saveSettings = function () {
    try { localStorage.setItem('paris2193', JSON.stringify(G.settings)); } catch (e) { /* pas grave */ }
  };

  // --- Aléatoire à graine : le monde est toujours identique d'une partie à l'autre ---
  let _s = 1337;
  G.rnd = function () {
    _s |= 0; _s = _s + 0x6D2B79F5 | 0;
    let t = Math.imul(_s ^ _s >>> 15, 1 | _s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  G.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  G.lerp = (a, b, t) => a + (b - a) * t;
  G.smooth = t => t * t * (3 - 2 * t);
  G.hash2 = (a, b) => { const h = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return h - Math.floor(h); };

  // --- Bruit "doux" qui se répète sans couture : base de toutes les saletés des textures ---
  G.makeNoise = function (S, cells, seed) {
    let s = seed; const g = [];
    for (let i = 0; i < cells * cells; i++) { s = (s * 16807) % 2147483647; g.push(s / 2147483647); }
    return (x, y) => {
      const fx = x / S * cells, fy = y / S * cells, x0 = Math.floor(fx), y0 = Math.floor(fy);
      const tx = G.smooth(fx - x0), ty = G.smooth(fy - y0);
      const X0 = ((x0 % cells) + cells) % cells, X1 = (X0 + 1) % cells, Y0 = ((y0 % cells) + cells) % cells, Y1 = (Y0 + 1) % cells;
      const a = g[Y0 * cells + X0], b = g[Y0 * cells + X1], c = g[Y1 * cells + X0], d = g[Y1 * cells + X1];
      return (a + (b - a) * tx) * (1 - ty) + (c + (d - c) * tx) * ty;
    };
  };
  // Plusieurs bruits de tailles différentes superposés = taches naturelles
  G.fbm = function (S) {
    const a = G.makeNoise(S, 4, 11), b = G.makeNoise(S, 8, 23), c = G.makeNoise(S, 16, 37);
    return (x, y) => a(x, y) * 0.5 + b(x, y) * 0.3 + c(x, y) * 0.2;
  };
  // Fissures : marches aléatoires. Renvoie l'ensemble des pixels fissurés.
  G.crackSet = function (S, count, len) {
    const set = new Set();
    for (let n = 0; n < count; n++) {
      let x = Math.floor(G.rnd() * S), y = Math.floor(G.rnd() * S), a = G.rnd() * 6.28;
      for (let i = 0; i < len; i++) {
        a += (G.rnd() - 0.5) * 0.9;
        x = (x + Math.round(Math.cos(a)) + S) % S; y = (y + Math.round(Math.sin(a)) + S) % S;
        set.add(y * S + x);
      }
    }
    return set;
  };

  G.loaded.push('core');
})();

</script>
<script>
/* ---- js/render.js ---- */
/* =====================================================================
   render.js : le rendu "brouillard doux + grain".
   1) La scène est dessinée dans une petite image (ex. 324 pixels de haut) AVEC sa carte de profondeur.
   2) Un filtre plein écran l'agrandit en l'adoucissant, puis ajoute :
      - OCCLUSION AMBIANTE (SSAO) : assombrit les creux, les coins, le pied des objets. C'est ce qui
        casse l'aspect "boîtes posées" : les angles se salissent comme dans la vraie vie ;
      - flou léger, halo sur les lumières, couleurs ternes, gros grain, bords sombres.
   Pas de lignes de balayage ni de décalage de couleurs (ça fatiguait les yeux).
   ===================================================================== */
(function () {
  'use strict';
  const G = window.G, T = G.T;
  const QUALITY_HEIGHT = { low: 240, medium: 324, high: 432 };

  const VERT = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position, 1.0); }`;
  const FRAG = `
    uniform sampler2D tDiffuse; uniform sampler2D tDepth; uniform vec2 texel; uniform float time; uniform float flash;
    uniform float near; uniform float far; uniform float tanHalf; uniform float aspect; uniform float aoK;
    varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    float linZ(float d){ float z = d * 2.0 - 1.0; return (2.0 * near * far) / (far + near - z * (far - near)); }
    void main(){
      vec2 c = vUv - 0.5;
      vec3 col = texture2D(tDiffuse, vUv).rgb;
      // --- Occlusion ambiante : on compare la profondeur du pixel à celle de ses voisins proches
      float zc = linZ(texture2D(tDepth, vUv).r), ao = 0.0;
      if (zc < far * 0.8 && aoK > 0.0) {
        float ry = 0.7 / zc * 0.5 / tanHalf;                       // rayon de 0,7 m projeté à l'écran
        ry = clamp(ry, texel.y * 2.0, 0.09); vec2 rad = vec2(ry / aspect, ry);
        float rot = hash(gl_FragCoord.xy) * 6.2832;
        for (int i = 0; i < 12; i++) {
          float a = rot + float(i) * 2.39996; float rr = (float(i) + 1.0) / 12.0;
          vec2 o = vec2(cos(a), sin(a)) * rad * (0.25 + 0.75 * rr);
          float zs = linZ(texture2D(tDepth, vUv + o).r), diff = zc - zs;
          ao += smoothstep(0.04, 0.3, diff) * (1.0 - smoothstep(0.6, 1.4, diff));
        }
        ao = clamp(ao / 12.0 * 1.6, 0.0, 1.0) * aoK * (1.0 - smoothstep(10.0, 28.0, zc));
      }
      col *= 1.0 - ao * 0.72;
      vec2 t = texel * 1.6;                                      // flou : moyenne avec les voisins
      vec3 blur = (texture2D(tDiffuse, vUv + vec2(t.x, 0.)).rgb + texture2D(tDiffuse, vUv - vec2(t.x, 0.)).rgb
                 + texture2D(tDiffuse, vUv + vec2(0., t.y)).rgb + texture2D(tDiffuse, vUv - vec2(0., t.y)).rgb) * 0.25;
      col = mix(col, blur * (1.0 - ao * 0.72), 0.5);
      vec2 t2 = texel * 5.0;                                     // halo : les zones claires débordent
      vec3 wide = (texture2D(tDiffuse, vUv + vec2(t2.x, t2.y)).rgb + texture2D(tDiffuse, vUv - vec2(t2.x, t2.y)).rgb
                 + texture2D(tDiffuse, vUv + vec2(-t2.x, t2.y)).rgb + texture2D(tDiffuse, vUv - vec2(-t2.x, t2.y)).rgb) * 0.25;
      col += max(wide - 0.32, 0.0) * 0.75;
      float l = dot(col, vec3(0.299, 0.587, 0.114));            // couleurs ternes, teinte froide un peu verdâtre
      col = mix(vec3(l), col, 0.62) * vec3(0.93, 1.0, 0.95) + 0.028;
      col += (hash(gl_FragCoord.xy + fract(time) * 71.0) - 0.5) * 0.13;   // grain (marqué)
      col *= smoothstep(1.15, 0.3, length(c) * 1.3);             // bords sombres, doux
      col += flash;
      gl_FragColor = vec4(col, 1.0);
    }`;

  G.initRender = function (canvas) {
    G.renderer = new T.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
    G.renderer.setPixelRatio(1);
    G.scene = new T.Scene();
    G.camera = new T.PerspectiveCamera(70, 16 / 9, 0.05, 90);
    G.camera.rotation.order = 'YXZ';        // d'abord gauche/droite, ensuite haut/bas
    G.postScene = new T.Scene();
    G.postCam = new T.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    G.postMat = new T.ShaderMaterial({
      uniforms: { tDiffuse: { value: null }, tDepth: { value: null }, texel: { value: new T.Vector2(1 / 576, 1 / 324) }, time: { value: 0 }, flash: { value: 0 },
                  near: { value: 0.05 }, far: { value: 90 }, tanHalf: { value: 0.7 }, aspect: { value: 16 / 9 }, aoK: { value: 1 } },
      vertexShader: VERT, fragmentShader: FRAG, depthTest: false, depthWrite: false
    });
    G.postScene.add(new T.Mesh(new T.PlaneGeometry(2, 2), G.postMat));
    window.addEventListener('resize', G.resize);
    G.resize();
  };

  G.resize = function () {
    const w = window.innerWidth, h = window.innerHeight;
    const ih = QUALITY_HEIGHT[G.settings.quality] || 324, iw = Math.max(2, Math.round(ih * w / h));
    G.renderer.setSize(w, h, false);
    if (G.rt) { G.rt.dispose(); if (G.rt.depthTexture) G.rt.depthTexture.dispose(); }
    G.rt = new T.WebGLRenderTarget(iw, ih, { minFilter: T.LinearFilter, magFilter: T.LinearFilter, format: T.RGBAFormat });
    G.rt.depthTexture = new T.DepthTexture(iw, ih); G.rt.depthTexture.type = T.UnsignedIntType;
    G.rt.depthTexture.minFilter = T.NearestFilter; G.rt.depthTexture.magFilter = T.NearestFilter;
    const u = G.postMat.uniforms;
    u.tDiffuse.value = G.rt.texture; u.tDepth.value = G.rt.depthTexture; u.texel.value.set(1 / iw, 1 / ih);
    u.aoK.value = G.settings.quality === 'low' ? 0 : 1;            // qualité Bas : pas d'occlusion ambiante (plus rapide)
    G.camera.aspect = w / h; G.camera.updateProjectionMatrix();
  };

  G.render = function (time) {
    const u = G.postMat.uniforms;
    u.time.value = time; u.aspect.value = G.camera.aspect; u.tanHalf.value = Math.tan(G.camera.fov * Math.PI / 360);
    G.renderer.setRenderTarget(G.rt);
    G.renderer.render(G.scene, G.camera);
    G.renderer.setRenderTarget(null);
    G.renderer.render(G.postScene, G.postCam);
  };

  G.loaded.push('render');
})();

<script>
/* ---- js/textures.js ---- */
/* =====================================================================
   textures.js : matières dessinées par code (128x128), volontairement un peu floues.
   Brutalisme : béton gris coulé dans des coffrages (joints + trous de tirants), taches, coulures.
   Les textures sont adoucies (filtrage linéaire) : pas de gros pixels carrés, une matière brute et molle.
   ===================================================================== */
(function () {
  'use strict';
  const G = window.G, T = G.T;

  // Fabrique une texture à partir d'une fonction (x, y) -> [r, g, b]
  G.makeTexture = function (S, fn) {
    const data = new Uint8ClampedArray(S * S * 4);
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
      const p = fn(x, y), i = (y * S + x) * 4;
      data[i] = p[0]; data[i + 1] = p[1]; data[i + 2] = p[2]; data[i + 3] = 255;
    }
    const c = document.createElement('canvas'); c.width = c.height = S;
    c.getContext('2d').putImageData(new ImageData(data, S, S), 0, 0);
    const t = new T.CanvasTexture(c);
    t.magFilter = T.LinearFilter; t.minFilter = T.LinearMipmapLinearFilter;
    t.wrapS = t.wrapT = T.RepeatWrapping;
    t.anisotropy = G.renderer ? G.renderer.capabilities.getMaxAnisotropy() : 1;
    return t;
  };

  // Béton coffré : un panneau de 2,5 m avec joints sur les bords et 4 trous de tirants, grain fin, taches, coulures.
  function concreteFn(S, tint, stain) {
    const f = G.fbm(S), f2 = G.makeNoise(S, 32, 5), f3 = G.makeNoise(S, 64, 9), cr = G.crackSet(S, 3, 40);
    const holes = [[S * 0.25, S * 0.25], [S * 0.75, S * 0.25], [S * 0.25, S * 0.75], [S * 0.75, S * 0.75]];
    return (x, y) => {
      let m = (0.5 + f(x, y) * 0.8) * (0.9 + (f3(x, y) - 0.5) * 0.4 + (G.rnd() - 0.5) * 0.12) * stain;
      if (G.hash2(Math.floor(x / 2), 7) > 0.8) m *= 0.75 + 0.25 * f2(x * 0.3, y);      // coulures d'eau
      if (x < 2 || y < 2) m *= 0.55;                                                    // joints du coffrage
      for (const h of holes) { const d = Math.hypot(x - h[0], y - h[1]); if (d < 3.4) m *= d < 2 ? 0.3 : 0.65; }   // trous de tirants
      if (cr.has(y * S + x)) m *= 0.45;
      return [104 * m * tint[0], 106 * m * tint[1], 104 * m * tint[2]];
    };
  }
  // Asphalte : très sombre, gravillons, fissures, taches
  function asphaltFn(S) {
    const f = G.fbm(S), cr = G.crackSet(S, 7, 70);
    return (x, y) => {
      let m = (0.55 + f(x, y) * 0.7) * (0.85 + G.rnd() * 0.3);
      if (G.rnd() < 0.012) m *= 1.25;
      if (cr.has(y * S + x)) m *= 0.4;
      return [40 * m, 42 * m, 44 * m];
    };
  }
  // Métal rouillé gris (tonneaux, rambardes)
  function metalFn(S) {
    const f = G.fbm(S), f2 = G.makeNoise(S, 32, 3);
    return (x, y) => {
      const g = f(x, y), q = 0.6 + f2(x, y) * 0.7;
      let r = 78 * q, gg = 80 * q, b = 80 * q;
      if (g > 0.55) { const k = 0.7 + f2(x, y) * 0.8; r = 105 * k; gg = 66 * k; b = 44 * k; }   // rouille
      if (G.hash2(Math.floor(x / 2), 9) > 0.86) { r *= 0.6; gg *= 0.6; b *= 0.6; }               // coulures
      return [r, gg, b];
    };
  }
  // Peinture d'appartement : vert-gris sale qui s'écaille, laisse voir le béton dessous
  function paintFn(S) {
    const f = G.fbm(S), f2 = G.makeNoise(S, 16, 14), con = concreteFn(S, [1, 1, 1], 1);
    return (x, y) => {
      if (f(x + 20, y + 7) + (f2(x, y) - 0.5) * 0.25 < 0.36) return con(x, y);                  // peinture écaillée -> béton
      const m = (0.55 + f(x, y) * 0.8) * (0.92 + G.rnd() * 0.12);
      return [96 * m, 108 * m, 92 * m];
    };
  }
  // Sol usé : béton sombre verdâtre
  function floorFn(S) {
    const f = G.fbm(S), f2 = G.makeNoise(S, 32, 21);
    return (x, y) => {
      const m = (0.5 + f(x, y) * 0.7) * (0.9 + G.rnd() * 0.15) * (x % 64 < 1 || y % 64 < 1 ? 0.55 : 1);
      return [66 * m, 72 * m, 66 * m * (0.95 + f2(x, y) * 0.1)];
    };
  }

  // Façade de vieil immeuble parisien : crépi gris-beige sali par la suie, coulures, fissures, pierre à nu par plaques
  function facadeFn(S) {
    const f = G.fbm(S), f2 = G.makeNoise(S, 16, 31), f3 = G.makeNoise(S, 8, 57), cr = G.crackSet(S, 6, 90);
    return (x, y) => {
      const g = f(x, y); let m = (0.42 + g * 0.95) * (0.9 + G.rnd() * 0.14);
      if (G.hash2(Math.floor(x / 3), 11) > 0.76) m *= 0.68 + 0.32 * f2(x * 0.2, y);                    // coulures de pluie
      let r = 138 * m, gg = 132 * m, b = 120 * m;
      if (f3(x + 30, y + 11) + (f2(x, y) - 0.5) * 0.35 > 0.64) {                                         // crépi tombé : pierre taillée dessous
        const row = Math.floor(y / 16), xs = (x + (row % 2 ? 16 : 0)) % S, v = G.hash2(Math.floor(xs / 32), row), q = (0.5 + f2(x, y) * 0.7) * m;
        if (y % 16 === 0 || xs % 32 === 0) { r = 40 * q; gg = 38 * q; b = 34 * q; } else { r = (88 + v * 24) * q; gg = (82 + v * 20) * q; b = (72 + v * 14) * q; }
      }
      if (cr.has(y * S + x)) { r *= 0.4; gg *= 0.4; b *= 0.4; }
      return [r, gg, b];
    };
  }

  // Neige d'écran cathodique : une petite image dont on redessine le bruit plusieurs fois par seconde
  G.makeStatic = function () {
    const c = document.createElement('canvas'); c.width = 64; c.height = 48;
    const g = c.getContext('2d'), img = g.createImageData(64, 48);
    const t = new T.CanvasTexture(c); t.magFilter = T.LinearFilter; t.minFilter = T.LinearFilter;
    let band = 0;
    return {
      texture: t,
      update(time) {
        band = (band + 1.7) % 48;
        for (let y = 0; y < 48; y++) for (let x = 0; x < 64; x++) {
          const i = (y * 64 + x) * 4, v = Math.random() * 150 + (Math.abs(y - band) < 3 ? 70 : 0);
          img.data[i] = v * 0.45; img.data[i + 1] = v; img.data[i + 2] = v * 0.78; img.data[i + 3] = 255;   // lueur verte
        }
        g.putImageData(img, 0, 0); t.needsUpdate = true;
      }
    };
  };

  // --- Matériaux (une seule fois). vertexColors = la "saleté cuite" dans la géométrie (voir world.js) ---
  G.buildMaterials = function () {
    const mk = (fn, o) => new T.MeshPhongMaterial(Object.assign({ map: G.makeTexture(128, fn), vertexColors: true, shininess: 3, specular: 0x111111 }, o || {}));
    G.mat = {
      concrete: mk(concreteFn(128, [1, 1, 1], 1)),
      facade: mk(facadeFn(128)),                                                  // murs des ruelles
      concreteDark: mk(concreteFn(128, [0.8, 0.82, 0.82], 0.8)),
      wall: mk(paintFn(128)),                                                   // murs intérieurs de l'appartement
      floor: mk(floorFn(128)),
      asphalt: mk(asphaltFn(128), { shininess: 8, specular: 0x101417 }),       // humide mais mat
      metal: mk(metalFn(128), { shininess: 12, specular: 0x222222 }),
      dark: new T.MeshPhongMaterial({ color: 0x08090a, shininess: 2 }),
      wood: new T.MeshPhongMaterial({ color: 0x4a3f30, shininess: 3 }),
      puddle: new T.MeshPhongMaterial({ color: 0x030405, shininess: 120, specular: 0x889099, transparent: true, opacity: 0.85, polygonOffset: true, polygonOffsetFactor: -3, polygonOffsetUnits: -3 }),
      iron: new T.MeshPhongMaterial({ color: 0x15171a, shininess: 20, specular: 0x333333 }),
      cloth: new T.MeshPhongMaterial({ color: 0x4b524a, shininess: 2 }),
      cloth2: new T.MeshPhongMaterial({ color: 0x6d7168, shininess: 2 }),
      plastic: new T.MeshPhongMaterial({ color: 0x3b3d3b, shininess: 14, specular: 0x222222 }),
      glass: new T.MeshPhongMaterial({ color: 0x1a2426, shininess: 90, specular: 0x8fa5ad, transparent: true, opacity: 0.35 })
    };
  };

  G.loaded.push('textures');
})();

</script>
<script>
/* ---- js/physics.js ---- */
/* =====================================================================
   physics.js : les obstacles solides et les questions qu'on leur pose.
   Deux sortes d'obstacles :
     - BOÎTES alignées (sols, marches, caisses, murs droits) : on peut marcher dessus.
     - SEGMENTS de mur (murs en biais des ruelles) : un trait vu du dessus, avec une hauteur.
   Pour aller vite, tout est rangé dans une grille de cases de 8 m : on ne regarde que les voisins.
   Le joueur est un CYLINDRE (rayon R, hauteur H) ; le sol de base est y = 0.
   ===================================================================== */
(function () {
  'use strict';
  const G = window.G;
  const CELL = 8, OFF = 4096;
  G.colliders = [];
  const grid = new Map();
  let stamp = 0;
  const key = (i, j) => (i + OFF) * 8192 + (j + OFF);

  function insert(c) {
    G.colliders.push(c);
    for (let i = Math.floor(c.minX / CELL); i <= Math.floor(c.maxX / CELL); i++)
      for (let j = Math.floor(c.minZ / CELL); j <= Math.floor(c.maxZ / CELL); j++) {
        const k = key(i, j); let a = grid.get(k); if (!a) grid.set(k, a = []); a.push(c);
      }
    return c;
  }
  G.addBoxCollider = (x0, x1, y0, y1, z0, z1) => insert({ t: 0, minX: x0, maxX: x1, minY: y0, maxY: y1, minZ: z0, maxZ: z1, q: 0 });
  G.addSegCollider = (ax, az, bx, bz, y0, y1) => insert({ t: 1, ax, az, bx, bz, l2: (bx - ax) * (bx - ax) + (bz - az) * (bz - az) || 1e-6,
    minX: Math.min(ax, bx), maxX: Math.max(ax, bx), minZ: Math.min(az, bz), maxZ: Math.max(az, bz), minY: y0, maxY: y1, q: 0 });
  // Un rectangle tourné (voiture, caisse en biais) = 4 segments
  G.addOBBCollider = function (cx, cz, w, d, ry, y0, y1) {
    const c = Math.cos(ry), s = Math.sin(ry), hw = w / 2, hd = d / 2;
    const P = [[-hw, -hd], [hw, -hd], [hw, hd], [-hw, hd]].map(p => [cx + p[0] * c + p[1] * s, cz - p[0] * s + p[1] * c]);
    for (let i = 0; i < 4; i++) G.addSegCollider(P[i][0], P[i][1], P[(i + 1) % 4][0], P[(i + 1) % 4][1], y0, y1);
  };

  // Obstacles proches d'un point (dans un rayon r)
  const tmp = [];
  function near(x, z, r) {
    tmp.length = 0; stamp++;
    for (let i = Math.floor((x - r) / CELL); i <= Math.floor((x + r) / CELL); i++)
      for (let j = Math.floor((z - r) / CELL); j <= Math.floor((z + r) / CELL); j++) {
        const a = grid.get(key(i, j)); if (!a) continue;
        for (let k = 0; k < a.length; k++) {
          const c = a[k]; if (c.q === stamp) continue; c.q = stamp;
          if (x + r > c.minX && x - r < c.maxX && z + r > c.minZ && z - r < c.maxZ) tmp.push(c);
        }
      }
    return tmp;
  }
  // Point le plus proche de (x,z) sur l'obstacle, rangé dans cp[0], cp[1]
  const cp = [0, 0];
  function closest(c, x, z) {
    if (c.t === 0) { cp[0] = x < c.minX ? c.minX : x > c.maxX ? c.maxX : x; cp[1] = z < c.minZ ? c.minZ : z > c.maxZ ? c.maxZ : z; }
    else { const dx = c.bx - c.ax, dz = c.bz - c.az; let t = ((x - c.ax) * dx + (z - c.az) * dz) / c.l2; t = t < 0 ? 0 : t > 1 ? 1 : t; cp[0] = c.ax + dx * t; cp[1] = c.az + dz * t; }
  }

  // Repousse le joueur hors des murs. Les obstacles bas (<= step) sont "franchissables" : on monte dessus à la place.
  // Renvoie la normale du mur le plus enfoncé (utile pour le wallrun), ou null.
  G.pushOut = function (p, y, H, R, step) {
    let best = null, bestPen = 0;
    for (let iter = 0; iter < 3; iter++) {
      let moved = false;
      const list = near(p.x, p.z, R);
      for (let k = 0; k < list.length; k++) {
        const c = list[k];
        if (c.maxY <= y + step + 1e-6 || c.minY >= y + H - 0.02) continue;
        closest(c, p.x, p.z);
        const dx = p.x - cp[0], dz = p.z - cp[1], d2 = dx * dx + dz * dz;
        if (d2 >= R * R) continue;
        let nx, nz, pen;
        if (d2 > 1e-8) { const d = Math.sqrt(d2); nx = dx / d; nz = dz / d; pen = R - d; }
        else if (c.t === 0) {                                     // centre dans une boîte : on sort par la face la plus proche
          const a = p.x - c.minX, b = c.maxX - p.x, e = p.z - c.minZ, f = c.maxZ - p.z, m = Math.min(a, b, e, f);
          nx = m === a ? -1 : m === b ? 1 : 0; nz = m === e ? -1 : m === f ? 1 : 0; pen = m + R;
        } else continue;
        p.x += nx * pen; p.z += nz * pen; moved = true;
        if (pen > bestPen) { bestPen = pen; best = { x: nx, z: nz, c }; }
      }
      if (!moved) break;
    }
    return best;
  };
  // Hauteur du sol sous les pieds : le plus haut dessus (<= y + marche) sous le cercle des pieds
  G.groundAt = function (x, z, y, r, maxStep) {
    let best = 0; const list = near(x, z, r);
    for (let k = 0; k < list.length; k++) {
      const c = list[k]; if (c.t !== 0 || c.maxY > y + maxStep + 1e-6 || c.maxY <= best) continue;
      closest(c, x, z); const dx = x - cp[0], dz = z - cp[1]; if (dx * dx + dz * dz < r * r) best = c.maxY;
    }
    return best;
  };
  // Plafond au-dessus de la tête (la plus basse face inférieure proche au-dessus)
  G.ceilingAt = function (x, z, y, H, r) {
    let best = Infinity; const list = near(x, z, r);
    for (let k = 0; k < list.length; k++) {
      const c = list[k]; if (c.t !== 0 || c.minY < y + H - 0.35 || c.minY >= best) continue;
      closest(c, x, z); const dx = x - cp[0], dz = z - cp[1]; if (dx * dx + dz * dz < r * r) best = c.minY;
    }
    return best;
  };
  // Y a-t-il quelque chose qui gêne un corps (H de haut, rayon R) debout en (x, y, z) ?
  G.blocked = function (x, z, y, H, R) {
    const list = near(x, z, R);
    for (let k = 0; k < list.length; k++) {
      const c = list[k]; if (c.maxY <= y + 0.05 || c.minY >= y + H - 0.05) continue;
      closest(c, x, z); const dx = x - cp[0], dz = z - cp[1]; if (dx * dx + dz * dz < R * R) return true;
    }
    return false;
  };
  // Plus haut sommet d'obstacle devant (pour les franchissements) : parmi les obstacles qui touchent la zone,
  // à hauteur des jambes (leur base est sous y + legs), renvoie le sommet le plus haut <= y + maxH ; 0 si aucun.
  G.topAhead = function (x, z, y, r, legs, maxH) {
    let best = -1; const list = near(x, z, r);
    for (let k = 0; k < list.length; k++) {
      const c = list[k]; if (c.t !== 0 || c.minY > y + legs || c.maxY > y + maxH || c.maxY <= y + 0.05 || c.maxY <= best) continue;
      closest(c, x, z); const dx = x - cp[0], dz = z - cp[1]; if (dx * dx + dz * dz < r * r) best = c.maxY;
    }
    return best;
  };

  G.loaded.push('physics');
})();

</script>
<script>
/* ---- js/world.js ---- */
/* =====================================================================
   world.js : le décor. Tout est fait de boîtes (brutalisme = gros blocs) dont la matière est brute.
   Axes : X largeur, Y hauteur, Z profondeur. Le joueur démarre dans l'appartement (y = 9),
   descend 3 étages par l'escalier, sort du hall (z = -2.65) dans une rue où il avance vers -z.
   Fonction d'entrée : G.buildWorld()
   ===================================================================== */
(function () {
  'use strict';
  const G = window.G, T = G.T;
  G.lamps = []; G.interactables = []; G.animated = [];

  /* ---------------------------------------------------------------
     BRIQUES DE BASE
     --------------------------------------------------------------- */
  // Géométrie de boîte : UV calculées dans le MONDE (la matière se prolonge d'une boîte à l'autre, sans raccord)
  // + "saleté cuite" en couleurs de sommets : sombre près du sol, plus clair en haut. Aucune lumière dynamique nécessaire.
  function boxGeo(w, h, d, cx, cy, cz, tile, grime, base) {
    const g = new T.BoxGeometry(w, h, d, 1, G.clamp(Math.ceil(h / 0.8), 1, 18), 1);
    const p = g.attributes.position, n = g.attributes.normal, uv = g.attributes.uv, col = new Float32Array(p.count * 3);
    for (let i = 0; i < p.count; i++) {
      const wx = p.getX(i) + cx, wy = p.getY(i) + cy, wz = p.getZ(i) + cz;
      const ax = Math.abs(n.getX(i)), ay = Math.abs(n.getY(i)), az = Math.abs(n.getZ(i));
      if (ax >= ay && ax >= az) uv.setXY(i, wz / tile, wy / tile); else if (ay >= az) uv.setXY(i, wx / tile, wz / tile); else uv.setXY(i, wx / tile, wy / tile);
      let k = 1;
      if (grime) k = (0.5 + 0.5 * G.smooth(G.clamp((wy - base) / 1.8, 0, 1))) * (0.93 + 0.07 * G.hash2(wx * 3.1 + wz * 1.7, wy * 2.3));
      col[i * 3] = col[i * 3 + 1] = col[i * 3 + 2] = k;
    }
    g.setAttribute('color', new T.BufferAttribute(col, 3));
    return g;
  }
  // B(x0,x1, y0,y1, z0,z1, matériau, options) : une boîte définie par ses limites. Collision par défaut.
  G.B = function (x0, x1, y0, y1, z0, z1, mat, o) {
    o = o || {};
    const w = x1 - x0, h = y1 - y0, d = z1 - z0, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, cz = (z0 + z1) / 2;
    let mesh = null;
    if (!o.nomesh) {
      mesh = new T.Mesh(boxGeo(w, h, d, cx, cy, cz, o.tile || 2.5, o.grime !== false, o.grimeBase !== undefined ? o.grimeBase : y0), mat);
      mesh.position.set(cx, cy, cz); G.scene.add(mesh);
    }
    if (o.collide !== false) G.addBoxCollider(x0, x1, y0, y1, z0, z1);
    return mesh;
  };
  // Mur avec ouvertures (portes, fenêtres). axis 'z' : épaisseur en z [c0,c1], longueur en x [a0,a1].
  // axis 'x' : épaisseur en x, longueur en z. openings : [a0, a1, y0, y1].
  G.wall = function (axis, c0, c1, a0, a1, y0, y1, openings, mat, o) {
    o = Object.assign({}, o || {}); o.grimeBase = y0; openings = openings || [];
    const br = new Set([a0, a1]); for (const op of openings) { br.add(op[0]); br.add(op[1]); }
    const bs = [...br].sort((a, b) => a - b);
    for (let i = 0; i < bs.length - 1; i++) {
      const p = bs[i], q = bs[i + 1]; if (q - p < 1e-6) continue;
      let spans = [[y0, y1]];
      for (const op of openings) if (op[0] <= p + 1e-6 && op[1] >= q - 1e-6) {
        const next = [];
        for (const s of spans) {
          if (op[3] <= s[0] || op[2] >= s[1]) next.push(s);
          else { if (op[2] > s[0]) next.push([s[0], op[2]]); if (op[3] < s[1]) next.push([op[3], s[1]]); }
        }
        spans = next;
      }
      for (const s of spans) { if (axis === 'z') G.B(p, q, s[0], s[1], c0, c1, mat, o); else G.B(c0, c1, s[0], s[1], p, q, mat, o); }
    }
  };
  G.glassPane = function (x0, x1, y0, y1, z0, z1) {   // vitre : transparente mais solide
    const m = new T.Mesh(new T.BoxGeometry(x1 - x0, y1 - y0, z1 - z0), G.mat.glass);
    m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2); G.scene.add(m);
    G.addBoxCollider(x0, x1, y0, y1, z0, z1);
  };

  /* ---------------------------------------------------------------
     LUMIÈRES : beaucoup de lampes "émissives" (ampoule + halo), mais seules les 3 plus proches
     éclairent vraiment (3 vraies lumières déplacées). C'est ce qui garde le jeu fluide.
     --------------------------------------------------------------- */
  let glowTex = null;
  G.addLamp = function (o) {
    const L = { pos: new T.Vector3(o.x, o.y, o.z), color: new T.Color(o.color || 0xffc880), I: o.I || 1, dist: o.dist || 10,
      flicker: o.flicker || 0, level: 1, cur: 1, burst: 0, blink: 0, phase: Math.random() * 10, base: o.halo === undefined ? 1.6 : o.halo };
    if (o.bulb !== false) {
      L.bulb = new T.Mesh(new T.SphereGeometry(0.06, 8, 6), new T.MeshBasicMaterial({ color: L.color }));
      L.bulb.position.copy(L.pos); G.scene.add(L.bulb);
    }
    if (L.base > 0) {
      L.halo = new T.Sprite(new T.SpriteMaterial({ map: glowTex, color: L.color, blending: T.AdditiveBlending, transparent: true, depthWrite: false, opacity: 0.5, fog: o.fogHalo !== true }));
      L.halo.position.copy(L.pos); L.halo.scale.set(L.base, L.base, 1); G.scene.add(L.halo);
    }
    G.lamps.push(L); return L;
  };
  G.updateLamps = function (dt, time) {
    const cam = G.camera.position;
    for (const L of G.lamps) {
      L.d2 = L.pos.distanceToSquared(cam);
      if (L.flicker > 0) {                                   // panne par à-coups
        if (L.burst > 0) {
          L.burst -= dt; L.blink -= dt;
          if (L.blink <= 0) { L.blink = 0.03 + Math.random() * 0.07; L.cur = Math.random() < 0.55 ? 0.05 + Math.random() * 0.25 : 0.6 + Math.random() * 0.4; }
          if (L.burst <= 0) L.cur = 1;
        } else if (Math.random() < L.flicker * dt) { L.burst = 0.08 + Math.random() * 0.5; L.blink = 0; }
        L.level = L.cur * (0.94 + 0.06 * Math.sin(time * 50 + L.phase));
      }
      if (L.bulb) L.bulb.material.color.copy(L.color).multiplyScalar(0.25 + 0.75 * L.level);
      if (L.halo) L.halo.material.opacity = 0.5 * L.level * (L.base > 2 ? G.smooth(G.clamp((Math.sqrt(L.d2) - 2) / 7, 0, 1)) : 1);   // grands halos : on ne s'aveugle pas dessous
    }
    const near = G.lamps.slice().sort((a, b) => a.d2 - b.d2);
    for (let i = 0; i < G.pool.length; i++) {
      const pl = G.pool[i], L = near[i];
      if (!L) { pl.intensity = 0; continue; }
      pl.position.copy(L.pos); pl.color.copy(L.color); pl.intensity = L.I * L.level; pl.distance = L.dist;
    }
  };
  function radialTexture(stops) {
    const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); for (const s of stops) gr.addColorStop(s[0], s[1]);
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return new T.CanvasTexture(c);
  }

  /* ---------------------------------------------------------------
     OÙ SUIS-JE ? (sert à ajuster brouillard et son)
     --------------------------------------------------------------- */
  G.zoneAt = function (p) { return (p.x > -2.1 && p.x < 2.1 && p.z > -2.65 && p.z < 8.3) ? 'in' : (G.isField && G.isField(p.x, p.z) ? 'field' : 'out'); };

  /* ---------------------------------------------------------------
     LA TOUR : appartement (y=9) + escalier + hall
     --------------------------------------------------------------- */
  function buildTower() {
    const M = G.mat;
    // Coque en béton
    G.B(-2.1, -1.8, 0, 11.9, -2.65, 8.3, M.concrete);                        // mur ouest
    G.B(1.8, 2.1, 0, 11.9, -2.65, 8.3, M.concrete);                          // mur est
    G.B(-2.1, 2.1, 0, 11.9, 8.0, 8.3, M.concrete);                           // mur du fond
    G.B(-2.1, 2.1, 11.6, 11.9, -2.65, 8.3, M.concreteDark, { grime: false }); // toit / plafond
    // Façade : porte du hall (en bas) et fenêtre de l'appartement (en haut, sur la rue)
    G.wall('z', -2.65, -2.35, -2.1, 2.1, 0, 11.9, [[-1.6, -0.4, 0, 2.3], [-0.5, 1.3, 10.0, 11.2]], M.concrete);
    G.glassPane(-0.5, 1.3, 10.0, 11.2, -2.52, -2.48);
    // Cloison entre l'appartement/hall et la cage d'escalier, avec deux portes (hall en bas, appartement en haut)
    G.wall('z', 3.0, 3.3, -2.1, 2.1, 0, 11.9, [[-1.3, -0.3, 0, 2.2], [-1.3, -0.3, 9, 11.1]], M.wall);
    // Masse pleine sous l'appartement (étages des voisins) : sa face du haut est le sol de l'appartement
    G.B(-1.8, 1.8, 3.0, 9.0, -2.35, 3.0, M.floor, { tile: 2, grime: false });
    G.B(-1.8, 1.8, -0.3, 0, -2.35, 8.0, M.floor, { tile: 2, grime: false });   // sol du hall et de l'escalier

    // --- Escalier : 3 étages, chacun = 2 volées de 8 marches (0,1875 m de haut) autour d'un palier ---
    const RISE = 0.1875, RUN = 0.275;
    for (const yf of [9, 6, 3]) {
      G.B(-1.8, 1.8, yf - 0.3, yf, 3.3, 4.7, M.concreteDark, { grime: false });                // palier d'étage (nord)
      G.B(-1.8, 1.8, yf - 1.8, yf - 1.5, 6.9, 8.0, M.concreteDark, { grime: false });          // palier intermédiaire (sud)
      for (let i = 1; i <= 8; i++) {                                                            // volée est : on descend vers le sud
        const top = yf - RISE * i, z0 = 4.7 + (i - 1) * RUN;
        G.B(0.1, 1.8, top - 0.3, top, z0, z0 + RUN, M.concreteDark, { grime: false });
      }
      for (let j = 1; j <= 8; j++) {                                                            // volée ouest : on redescend vers le nord
        const top = yf - 1.5 - RISE * j, z1 = 6.9 - (j - 1) * RUN;
        G.B(-1.8, -0.1, top - 0.3, top, z1 - RUN, z1, M.concreteDark, { grime: false });
      }
    }
    // Lampes de palier : fatiguées, vert-jaune, certaines grésillent
    [[9, 0.05], [6, 0.35], [3, 0.5], [0, 0.15]].forEach(([yf, fl]) => G.addLamp({ x: 0, y: yf + 2.25, z: 3.9, color: 0xcfd8a0, I: 1.7, dist: 9, flicker: fl, halo: 1.0 }));
    G.addLamp({ x: 0, y: 2.6, z: 0.4, color: 0xb9c8a8, I: 1.2, dist: 8, flicker: 0.3, halo: 0.9 });   // hall

    buildApartment();
  }

  function buildApartment() {
    const M = G.mat;
    // Lit : un matelas à même un cadre bas, un oreiller. Rien d'autre sur les murs : espace vide, pour l'instant.
    G.B(-1.75, -0.75, 9.0, 9.32, -2.3, -0.3, M.cloth, { grime: false, tile: 1 });
    G.B(-1.7, -0.85, 9.32, 9.42, -2.25, -1.75, M.cloth2, { grime: false, collide: false });
    // Bureau + vieil écran cathodique (ses pixels de neige sont la lumière principale de la pièce)
    G.B(0.9, 1.75, 9.68, 9.74, -2.3, -0.8, M.plastic, { grime: false, tile: 1 });
    for (const [x, z] of [[0.95, -2.25], [1.7, -2.25], [0.95, -0.85], [1.7, -0.85]]) G.B(x - 0.03, x + 0.03, 9.0, 9.68, z - 0.03, z + 0.03, M.iron, { grime: false, collide: false });
    G.B(1.12, 1.56, 9.74, 10.12, -1.8, -1.38, M.plastic, { grime: false, collide: false });           // boîtier du moniteur
    G.B(1.3, 1.58, 9.74, 9.8, -1.7, -1.46, M.plastic, { grime: false, collide: false });
    const stat = G.makeStatic();
    const screen = new T.Mesh(new T.PlaneGeometry(0.3, 0.24), new T.MeshBasicMaterial({ map: stat.texture }));
    screen.position.set(1.108, 9.94, -1.59); screen.rotation.y = -Math.PI / 2; G.scene.add(screen);
    G.animated.push({ t: 0, update(dt) { this.t += dt; if (this.t > 0.07) { this.t = 0; stat.update(performance.now() / 1000); } } });
    G.crtPos = new T.Vector3(1.2, 9.95, -1.59);
    G.addLamp({ x: 1.0, y: 9.95, z: -1.59, color: 0x7dffd0, I: 0.9, dist: 5.5, flicker: 0.25, halo: 0.7, bulb: false });   // lueur verdâtre de l'écran
    G.addLamp({ x: 0, y: 11.25, z: 0.2, color: 0xe6c690, I: 0.35, dist: 6, halo: 0.8 });                                   // ampoule nue, très faible

    // Le briquet : un Bic classique gris, posé sur le bureau. Premier objet de la partie.
    const lighter = new T.Group();
    const bodyMesh = new T.Mesh(new T.BoxGeometry(0.024, 0.075, 0.013), new T.MeshPhongMaterial({ color: 0x82868a, shininess: 40, specular: 0x555555 }));
    const cap = new T.Mesh(new T.BoxGeometry(0.022, 0.014, 0.012), new T.MeshPhongMaterial({ color: 0xb9bcbe, shininess: 90, specular: 0xffffff }));
    cap.position.y = 0.043; lighter.add(bodyMesh, cap);
    lighter.position.set(1.35, 9.74 + 0.0125, -1.05); lighter.rotation.set(Math.PI / 2, 0, 0.7); G.scene.add(lighter);
    const glint = new T.Sprite(new T.SpriteMaterial({ map: glowTex, color: 0xdfe8ff, blending: T.AdditiveBlending, transparent: true, depthWrite: false, opacity: 0.0 }));
    glint.position.set(1.35, 9.8, -1.05); glint.scale.set(0.16, 0.16, 1); G.scene.add(glint);
    G.animated.push({ update(dt) { if (lighter.visible) glint.material.opacity = 0.18 + 0.12 * Math.sin(performance.now() / 700); else glint.material.opacity = 0; } });
    G.interactables.push({
      id: 'lighter', pos: new T.Vector3(1.35, 9.78, -1.05), radius: 1.9, prompt: 'Ramasser le briquet',
      use() { lighter.visible = false; G.interactables = G.interactables.filter(i => i.id !== 'lighter'); G.have = G.have || []; G.have.push('bic-gris');
        G.say('Un Bic gris. Un classique. Le premier de la collection.'); if (G.audio.flick) G.audio.flick(); }
    });
  }

  /* ---------------------------------------------------------------
     LE CORPS dans la rue (même retenue qu'avant, sans scène scriptée pour l'instant)
     --------------------------------------------------------------- */
  function limb(group, mat, p0, p1, r0, r1, seg) {
    const a = new T.Vector3(...p0), b = new T.Vector3(...p1), len = a.distanceTo(b);
    const m = new T.Mesh(new T.CylinderGeometry(r1, r0, len, seg || 10), mat);
    m.position.copy(a).add(b).multiplyScalar(0.5); m.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), b.clone().sub(a).normalize());
    group.add(m); return m;
  }
  function ball(group, mat, p, r, sx, sy, sz, seg) {
    const m = new T.Mesh(new T.SphereGeometry(r, seg || 12, (seg || 12) - 2), mat); m.position.set(...p); m.scale.set(sx || 1, sy || 1, sz || 1); group.add(m); return m;
  }
  G.buildBody = function (px, pz, ry) {
    const g = new T.Group(); g.position.set(px, 0, pz); g.rotation.y = ry || 0;
    const ph = c => new T.MeshPhongMaterial({ color: c, shininess: 6 });
    const jacket = ph(0x1b1e21), pants = ph(0x14161a), skin = new T.MeshPhongMaterial({ color: 0x7d7068, shininess: 10 }), dark = ph(0x0c0c0e), boot = ph(0x0b0b0d);
    const blood = new T.MeshPhongMaterial({ color: 0x2a0707, shininess: 70, specular: 0x552222, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
    const shape = new T.Shape();
    for (let i = 0; i <= 28; i++) { const a = i / 28 * 6.2832, r = 0.55 + 0.25 * Math.sin(a * 3 + 1) + 0.12 * Math.sin(a * 5); i ? shape.lineTo(Math.cos(a) * r * 1.2, Math.sin(a) * r) : shape.moveTo(Math.cos(a) * r * 1.2, Math.sin(a) * r); }
    const pool = new T.Mesh(new T.ShapeGeometry(shape), blood); pool.rotation.x = -Math.PI / 2; pool.position.set(-0.1, 0.014, -0.05); g.add(pool);
    ball(g, jacket, [0, 0.14, -0.14], 0.27, 1.0, 0.5, 0.95); ball(g, jacket, [0, 0.12, 0.2], 0.23, 1.0, 0.5, 1.0); ball(g, pants, [0, 0.11, 0.42], 0.17, 1.15, 0.7, 0.8);
    ball(g, jacket, [0.3, 0.13, -0.3], 0.1); ball(g, jacket, [-0.3, 0.13, -0.3], 0.1);
    const head = new T.Group(); head.position.set(0.05, 0.13, -0.64); head.rotation.z = 0.35; head.rotation.y = 0.2; g.add(head);
    limb(g, skin, [0, 0.12, -0.42], [0.04, 0.13, -0.55], 0.06, 0.055);
    ball(head, skin, [0, 0, 0], 0.115, 0.92, 1.0, 1.1); ball(head, dark, [0, -0.025, -0.022], 0.12, 0.98, 1.0, 1.08);
    ball(head, skin, [0, 0, 0.1], 0.04, 0.9, 0.8, 0.9, 8); ball(head, skin, [0, 0.098, -0.02], 0.022, 0.8, 1.0, 1.2, 8);
    for (const s of [-1, 1]) ball(head, dark, [s * 0.045, 0.1, -0.05], 0.022, 1.3, 0.35, 0.8, 8);
    limb(g, jacket, [0.3, 0.13, -0.3], [0.56, 0.1, -0.4], 0.085, 0.07); limb(g, jacket, [0.56, 0.1, -0.4], [0.86, 0.06, -0.62], 0.07, 0.055);
    ball(g, skin, [0.9, 0.045, -0.65], 0.05, 1.1, 0.5, 1.3, 8);
    for (let f = 0; f < 4; f++) limb(g, skin, [0.92 + f * 0.012, 0.04, -0.68 - f * 0.018], [1.0 + f * 0.015, 0.025, -0.74 - f * 0.05], 0.011, 0.008, 5);
    limb(g, jacket, [-0.3, 0.13, -0.3], [-0.52, 0.1, -0.08], 0.085, 0.07); limb(g, jacket, [-0.52, 0.1, -0.08], [-0.24, 0.17, 0.08], 0.07, 0.055);
    limb(g, pants, [0.12, 0.11, 0.45], [0.32, 0.3, 0.88], 0.11, 0.085); limb(g, pants, [0.32, 0.3, 0.88], [0.22, 0.08, 1.22], 0.085, 0.06); ball(g, boot, [0.22, 0.07, 1.3], 0.085, 0.95, 0.75, 1.7);
    limb(g, pants, [-0.12, 0.11, 0.47], [-0.2, 0.1, 0.95], 0.11, 0.085); limb(g, pants, [-0.2, 0.1, 0.95], [-0.3, 0.07, 1.42], 0.085, 0.06); ball(g, boot, [-0.32, 0.07, 1.5], 0.085, 0.95, 0.75, 1.7);
    const usb = new T.Mesh(new T.BoxGeometry(0.05, 0.02, 0.15), new T.MeshPhongMaterial({ color: 0x8c98a4, shininess: 90, specular: 0xffffff }));
    usb.position.set(1.12, 0.012, -0.78); usb.rotation.y = 0.5; g.add(usb);
    G.scene.add(g);
  };

  /* ---------------------------------------------------------------
     POINT D'ENTRÉE : construit tout (appelé une fois par G.boot)
     --------------------------------------------------------------- */
  G.buildWorld = function () {
    glowTex = G.glowTex = radialTexture([[0, 'rgba(255,255,255,0.9)'], [0.25, 'rgba(255,255,255,0.32)'], [1, 'rgba(255,255,255,0)']]);
    G.scene.background = new T.Color(0x161b1e);
    G.scene.fog = new T.FogExp2(0x161b1e, 0.09);
    G.scene.add(new T.HemisphereLight(0x55626b, 0x1d2224, 0.95));         // ciel gris-bleu en haut, sol sombre en bas
    G.pool = [0, 1, 2].map(() => { const l = new T.PointLight(0xffffff, 0, 10, 2); G.scene.add(l); return l; });
    buildTower(); G.buildCity();
  };

  G.loaded.push('world');
})();

<script>
/* ---- js/city.js ---- */
/* =====================================================================
   city.js : la ville, construite à partir du schéma ASCII (voir G.MAP_ASCII ci-dessous et docs/carte-v1.txt).
   Idée : on décrit l'ESPACE LIBRE (ruelles = lignes brisées épaissies, place = ellipse, alcôves, garage, zone plate)
   avec une "distance signée" ; tout le reste est de la masse de bâtiments. On trace le CONTOUR de l'espace libre
   (algorithme "marching squares") et on élève des murs le long de ce contour : ruelles en biais, irrégulières,
   sans angles droits obligatoires. 1 case ASCII = 4 m ; la tour du joueur est à l'origine (0, 0).
   ===================================================================== */
(function () {
  'use strict';
  const G = window.G, T = G.T;

  // Le schéma d'origine, conservé ici comme référence (nord en haut). A=tour, F=place, E=égout, G=garage,
  // B=corps, !=clé USB, X=grille, +=cachettes, r=parcours en hauteur, C=épaves, L=lampadaires, t=arbres, s=abribus.
  G.MAP_ASCII = `CARTE v1 (schéma). 1 caractère = 4 m. Nord en haut.

     0         1         2         3         4         5         6   
     0123456789012345678901234567890123456789012345678901234567890123
  0  ########################################~~~~~~~~~~~~~~~~~~~~~~~~
  1  ###########################X##############~~~~~~~~~~~~~~~~~~~~~~
  2  #######################....################~~~~~~~~~~~~~~~~~~~~~
  3  #####################..#####################~~~~L~~~~~~~~~~~~~~~
  4  ###################..######################~~~~~~~~~~~~~~~~~DD~~
  5  ##################.######################~~~~~~~~~~~~~~~~~~~DD~~
  6  ##################.#####################~~~~~~~~~~C~~~~~~~~~~~~~
  7  ###E###############.####################~~~~~~~~~~~~~~~~~~~~~~~~
  8  ###.###############.:####################~s~~~~~~~~~~~~~~~~~~~~~
  9  ###.############:::::::::###########......~~~~~~~~~~~t~~~~~~~~~~
 10  ###.###########:::::::::::#######...#####~~~L~~~~~~~~~~~~~~~~~~~
 11  ###.##########:::::::::::::####..#######~~~~~~~~~~~~~~~~~~~~~~x~
 12  ###.+#########::::::F::::::....+######~~~~~~~~C~~~~~~~~~~~~~~~x~
 13  ####.#########:::::::::::::#########~~~~~~~~~~~~~~~~~~~~~~~~~~x~
 14  ####.#######..#:::::::::::#.##r####~~~~~~~~~~~~~~~~~~~~~~~t~~~x~
 15  ####.####B..####:::::::::##.###r###~~~~~~~~~~~~~~~L~~~~~~~~~~~x~
 16  #####.###.##.##r####:#.#####.###r####~~~~~~~~~~~~~~~~~~~~~~~~~x~
 17  #####.#..###.#r######.#.#####.###r#####~~~~~~~~t~~~~~~~~~~~~~~x~
 18  ######.######.######.##.#####.###r#######~~~~~~~~~~~~~~~~~~~~~x~
 19  ######.#####.######.####.###+############~~~~~~~~~~~~~~~~~~~~~~~
 20  ######.####r.!####.######....############~~~~~~~~~~~C~~~~~~~~~~~
 21  ######.###r.#####.##########.############~~t~~~~~~~~~~~~~~~~~~~~
 22  ######.....#+###.############..#########~~~~~~~~~~~~~~~~L~~~~~~~
 23  ######.#r#####..###############.#########~~~~~~~~~~~~~~~~~~~~~~~
 24  ######.######.##################...#######~~~~~~~~~t~~~~~~~~~~~~
 25  ######A############################.G######~~~~~~~~~~~~~~~~~~~~~
 26  #######################################s###~~C~~~~~~~~~~~~~~~~~~
 27  ###########################################~~~~~~~~~~~~t~~~~~~~~
 28  #########################################~~~~~~~~~~~~~~~~~~~~~~~
 29  ######################################~~~~~~~~~~~~~~~~~~~~~~~~~~`;

  // Case ASCII (colonne, ligne) -> monde (x, z). La tour (colonne 6, ligne 25) est à l'origine, sa façade à z = -2,65.
  const A = (c, r) => [(c - 6) * 4, (r - 25) * 4 - 0.65];
  G.mapWorld = A;

  /* ---------------------------------------------------------------
     1. L'ESPACE LIBRE
     --------------------------------------------------------------- */
  const ALLEYS = [   // w = demi-largeur en mètres
    { w: 2.1, pts: [[0, -2.65], A(6, 18)] },                                                      // sortie de la tour (aussi large que la tour)
    { w: 1.6, pts: [A(6, 18), A(4, 15), A(3, 11), A(3, 8)] },                                     // branche nord-ouest -> égout
    { w: 2.0, pts: [A(6, 18), A(9, 16), A(12, 14), A(15, 13), A(18, 12)] },                       // branche nord-est -> place
    { w: 1.5, pts: [A(6, 22), A(10, 22), A(12, 20), A(13, 18), A(12, 16)] },                      // boucle avec cour
    { w: 2.2, pts: [A(20, 12), A(26, 12), A(30, 12), A(33, 10), A(37, 9), A(41, 9)] },            // vers la zone plate
    { w: 2.0, pts: [A(21, 14), A(24, 19), A(28, 21), A(31, 23), A(35, 25)] },                     // vers le garage
    { w: 1.8, pts: [A(19, 10), A(18, 5), A(21, 3), A(25, 2), A(27, 1)] },                         // vers le nord (grille)
    { w: 1.7, pts: [A(26, 12), A(27, 15), A(29, 17), A(28, 21)] },                                // raccord central
    { w: 1.6, pts: [A(6, 23), A(10, 24), A(13, 24), A(16, 22), A(19, 19), A(21, 17), A(23, 18)] }  // ruelle du sud
  ];
  const PLACE = { c: A(20, 12), rx: 22, rz: 13 };
  const ALCOVES = [A(4, 12), A(12, 22), A(28, 19), A(31, 12)];     // cachettes (porche, cour)
  const GARAGE = { c: [126, -0.65], hx: 9, hz: 5.5 };
  const TOWER = { x0: -2.1, x1: 2.1, z0: -2.65, z1: 8.3 };         // la tour est pleine (elle a sa propre géométrie)
  const X0 = -30, X1 = 234, Z0 = -106, Z1 = 20;                    // limites de la carte (mètres)

  const xlim = z => { const row = (z + 0.65) / 4 + 25; return ((40 + 3 * Math.sin(row / 3) + 2 * Math.sin(row / 1.3)) - 6) * 4 - 2; };   // bord est de la ville
  G.isField = (x, z) => x > xlim(z) + 1;

  function distSeg(x, z, p, q) {
    const dx = q[0] - p[0], dz = q[1] - p[1]; let t = ((x - p[0]) * dx + (z - p[1]) * dz) / (dx * dx + dz * dz || 1); t = t < 0 ? 0 : t > 1 ? 1 : t;
    return Math.hypot(x - p[0] - dx * t, z - p[1] - dz * t);
  }
  const vn = (x, z) => {    // bruit de valeur : irrégularité des murs
    const xi = Math.floor(x), zi = Math.floor(z), tx = G.smooth(x - xi), tz = G.smooth(z - zi), h = G.hash2;
    return (h(xi, zi) * (1 - tx) + h(xi + 1, zi) * tx) * (1 - tz) + (h(xi, zi + 1) * (1 - tx) + h(xi + 1, zi + 1) * tx) * tz;
  };
  function sdf(x, z) {      // < 0 : espace libre ; > 0 : bâtiment
    let d = xlim(z) - x;                                                       // zone plate à l'est
    for (const a of ALLEYS) for (let i = 0; i < a.pts.length - 1; i++) d = Math.min(d, distSeg(x, z, a.pts[i], a.pts[i + 1]) - a.w);
    d = Math.min(d, (Math.sqrt(((x - PLACE.c[0]) / PLACE.rx) ** 2 + ((z - PLACE.c[1]) / PLACE.rz) ** 2) - 1) * PLACE.rz);
    for (const c of ALCOVES) d = Math.min(d, Math.hypot(x - c[0], z - c[1]) - 2.4);
    d = Math.min(d, Math.max(Math.abs(x - GARAGE.c[0]) - GARAGE.hx, Math.abs(z - GARAGE.c[1]) - GARAGE.hz));
    d += (vn(x / 7, z / 7) - 0.5) * 0.6 + (vn(x / 2.3, z / 2.3) - 0.5) * 0.3;
    const tx = Math.max(TOWER.x0 - x, x - TOWER.x1, TOWER.z0 - z, z - TOWER.z1);   // distance au rectangle de la tour (négatif dedans)
    return Math.max(d, -tx);
  }

  /* ---------------------------------------------------------------
     2. LES MURS : contour de l'espace libre, puis extrusion
     --------------------------------------------------------------- */
  function buildWalls() {
    const NX = X1 - X0 + 1, NZ = Z1 - Z0 + 1, D = new Float32Array(NX * NZ);
    for (let j = 0; j < NZ; j++) for (let i = 0; i < NX; i++) D[j * NX + i] = sdf(X0 + i, Z0 + j);
    const segs = [], TABLE = [null, [[3, 0]], [[0, 1]], [[3, 1]], [[1, 2]], [[3, 0], [1, 2]], [[0, 2]], [[3, 2]], [[2, 3]], [[0, 2]], [[0, 1], [2, 3]], [[1, 2]], [[1, 3]], [[0, 1]], [[3, 0]], null];
    for (let j = 0; j < NZ - 1; j++) for (let i = 0; i < NX - 1; i++) {
      const v0 = D[j * NX + i], v1 = D[j * NX + i + 1], v2 = D[(j + 1) * NX + i + 1], v3 = D[(j + 1) * NX + i];
      const idx = (v0 < 0 ? 1 : 0) | (v1 < 0 ? 2 : 0) | (v2 < 0 ? 4 : 0) | (v3 < 0 ? 8 : 0), cases = TABLE[idx]; if (!cases) continue;
      const x = X0 + i, z = Z0 + j;
      const E = [[x + v0 / (v0 - v1), z], [x + 1, z + v1 / (v1 - v2)], [x + v3 / (v3 - v2), z + 1], [x, z + v0 / (v0 - v3)]];
      for (const c of cases) segs.push([E[c[0]][0], E[c[0]][1], E[c[1]][0], E[c[1]][1]]);
    }
    // Géométrie : chaque segment devient un mur à plusieurs niveaux (pour la saleté "cuite" : sombre en bas)
    const LV = [0, 0.5, 1.6, 3.2, 6]; const pos = [], nor = [], uv = [], col = [], idxs = []; const walls = [];
    const tile = 5;
    for (const s of segs) {
      let [ax, az, bx, bz] = s; const len = Math.hypot(bx - ax, bz - az); if (len < 0.05) continue;
      const mx = (ax + bx) / 2, mz = (az + bz) / 2;
      if (Math.abs(mx) < 2.6 && mz > -3.2 && mz < -2.1) continue;                  // pas de mur devant la porte de la tour
      let nx = -(bz - az) / len, nz = (bx - ax) / len;
      if (sdf(mx + nx * 0.3, mz + nz * 0.3) > sdf(mx - nx * 0.3, mz - nz * 0.3)) { nx = -nx; nz = -nz; }   // normale vers l'espace libre
      if (-(bz - az) * nx + (bx - ax) * nz < 0) { const tx = ax, tz = az; ax = bx; az = bz; bx = tx; bz = tz; }     // sens des triangles
      const h = 9 + 6 * G.hash2(Math.floor(mx / 15), Math.floor(mz / 15));
      G.addSegCollider(ax, az, bx, bz, 0, h);
      walls.push({ mx, mz, nx, nz, h, len });
      const levels = LV.filter(y => y < h - 0.5).concat([h]), base = pos.length / 3;
      const useX = Math.abs(nx) > Math.abs(nz);
      for (const y of levels) {
        const k = [0.6, 0.74, 0.89, 0.97, 1.0][Math.min(levels.indexOf(y), 4)] * (0.9 + 0.1 * G.hash2(mx * 1.7, y));
        for (const P of [[ax, az], [bx, bz]]) {
          pos.push(P[0], y, P[1]); nor.push(nx, 0, nz); uv.push((useX ? P[1] : P[0]) / tile, y / tile); col.push(k, k, k);
        }
      }
      for (let r = 0; r < levels.length - 1; r++) { const a = base + r * 2; idxs.push(a, a + 1, a + 3, a, a + 3, a + 2); }
    }
    const g = new T.BufferGeometry();
    g.setAttribute('position', new T.Float32BufferAttribute(pos, 3)); g.setAttribute('normal', new T.Float32BufferAttribute(nor, 3));
    g.setAttribute('uv', new T.Float32BufferAttribute(uv, 2)); g.setAttribute('color', new T.Float32BufferAttribute(col, 3)); g.setIndex(idxs);
    G.scene.add(new T.Mesh(g, G.mat.facade));
    return walls;
  }
  // Détails de façade : fentes de fenêtres, portes, descentes d'eau (objets "instanciés" = un seul dessin chacun)
  function buildFacadeDetails(walls) {
    const M = G.mat, slit = [], lit = [], doors = [], drains = [];
    for (const w of walls) {
      const r = G.hash2(w.mx * 0.37, w.mz * 0.53);
      if (r > 0.80) for (const y of [3.2, 6.4, 9.6, 12.8]) if (y + 1 < w.h) (G.hash2(w.mx + y, w.mz) > 0.92 ? lit : slit).push([w.mx + w.nx * 0.05, y, w.mz + w.nz * 0.05, w.nx, w.nz]);
      else if (r < 0.04) doors.push([w.mx + w.nx * 0.06, 1.05, w.mz + w.nz * 0.06, w.nx, w.nz]);
      else if (r > 0.45 && r < 0.47) drains.push([w.mx + w.nx * 0.1, w.h / 2, w.mz + w.nz * 0.1, w.h]);
    }
    const d = new T.Object3D();
    const inst = (list, geo, mat, scale) => {
      if (!list.length) return; const im = new T.InstancedMesh(geo, mat, list.length);
      list.forEach((s, i) => { d.position.set(s[0], s[1], s[2]); d.rotation.set(0, Math.atan2(s[3], s[4]), 0); const sc = scale(s); d.scale.set(sc[0], sc[1], sc[2]); d.updateMatrix(); im.setMatrixAt(i, d.matrix); });
      G.scene.add(im);
    };
    const box = new T.BoxGeometry(1, 1, 1);
    inst(slit, box, M.dark, () => [0.9, 1.4, 0.14]);
    inst(lit, box, new T.MeshBasicMaterial({ color: 0x5b4c32 }), () => [0.9, 1.4, 0.14]);
    inst(doors, box, new T.MeshPhongMaterial({ color: 0x1c1d1c, shininess: 6 }), () => [1.1, 2.1, 0.16]);
    const dr = new T.InstancedMesh(new T.CylinderGeometry(0.07, 0.07, 1, 8), M.metal, drains.length), dd = new T.Object3D();
    drains.forEach((s, i) => { dd.position.set(s[0], s[1], s[2]); dd.rotation.set(0, 0, 0); dd.scale.set(1, s[3], 1); dd.updateMatrix(); dr.setMatrixAt(i, dd.matrix); }); if (drains.length) G.scene.add(dr);
  }
  // Sol : un grand plan. Ville = asphalte sombre ; zone plate = plus clair, terreux. Taches de bruit.
  function buildGround() {
    const W = X1 - X0 + 140, H = Z1 - Z0 + 140, cx = (X0 + X1) / 2, cz = (Z0 + Z1) / 2, sx = Math.round(W / 2.5), sz = Math.round(H / 2.5);
    const g = new T.PlaneGeometry(W, H, sx, sz); g.rotateX(-Math.PI / 2);
    const p = g.attributes.position, uv = g.attributes.uv, col = new Float32Array(p.count * 3);
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i) + cx, z = p.getZ(i) + cz; p.setX(i, x); p.setZ(i, z); uv.setXY(i, x / 3, z / 3);
      const field = G.smooth(G.clamp((x - xlim(z)) / 8, 0, 1)), m = 0.75 + 0.5 * vn(x / 9, z / 9);
      const k = G.lerp(1.0, 1.35, field) * m; col[i * 3] = k * G.lerp(1, 1.0, field); col[i * 3 + 1] = k * G.lerp(1, 1.05, field); col[i * 3 + 2] = k * G.lerp(1, 0.9, field);
    }
    p.needsUpdate = true; g.setAttribute('color', new T.BufferAttribute(col, 3));
    G.scene.add(new T.Mesh(g, G.mat.asphalt));
    // Murs invisibles aux limites de la zone plate (le brouillard cache le reste)
    G.addBoxCollider(X1, X1 + 5, -5, 40, Z0 - 5, Z1 + 5); G.addBoxCollider(X0 - 5, X1 + 5, -5, 40, Z0 - 5, Z0); G.addBoxCollider(X0 - 5, X1 + 5, -5, 40, Z1, Z1 + 5);
  }

  /* ---------------------------------------------------------------
     3. PROPS : lampadaires, tonneaux, caisses, barrières, épaves, arbres...
     --------------------------------------------------------------- */
  const M = () => G.mat;
  function alleyPoint(a, dist) {     // point et direction à une distance donnée le long d'une ruelle
    let d = dist;
    for (let i = 0; i < a.pts.length - 1; i++) {
      const p = a.pts[i], q = a.pts[i + 1], L = Math.hypot(q[0] - p[0], q[1] - p[1]);
      if (d <= L || i === a.pts.length - 2) { const t = G.clamp(d / L, 0, 1); return { x: p[0] + (q[0] - p[0]) * t, z: p[1] + (q[1] - p[1]) * t, dx: (q[0] - p[0]) / L, dz: (q[1] - p[1]) / L }; }
      d -= L;
    }
  }
  const alleyLen = a => a.pts.slice(1).reduce((s, q, i) => s + Math.hypot(q[0] - a.pts[i][0], q[1] - a.pts[i][1]), 0);
  function side(a, dist, off) { const p = alleyPoint(a, dist); return [p.x - p.dz * off, p.z + p.dx * off, Math.atan2(p.dx, p.dz)]; }   // décalé sur le côté (off > 0 = gauche)

  function lamp(x, z, ax, az, color, I, halo, flick) {              // lampadaire sodium : pied en (x,z), bras vers (ax,az)
    const pole = new T.Mesh(new T.CylinderGeometry(0.05, 0.07, 5.4, 8), M().iron); pole.position.set(x, 2.7, z); G.scene.add(pole);
    const ang = Math.atan2(ax - x, az - z), arm = new T.Mesh(new T.BoxGeometry(0.07, 0.07, 1.0), M().iron);
    arm.position.set(x + Math.sin(ang) * 0.5, 5.4, z + Math.cos(ang) * 0.5); arm.rotation.y = ang; G.scene.add(arm);
    G.addBoxCollider(x - 0.08, x + 0.08, 0, 5.4, z - 0.08, z + 0.08);
    G.addLamp({ x: x + Math.sin(ang) * 1.0, y: 5.3, z: z + Math.cos(ang) * 1.0, color: color || 0xffa44a, I: I || 0.95, dist: 14, halo: halo || 5.5, flicker: flick || 0, fogHalo: true });
  }
  function barrel(x, z) {
    const b = new T.Mesh(new T.CylinderGeometry(0.3, 0.3, 0.9, 14), M().metal); b.position.set(x, 0.45, z); G.scene.add(b);
    for (const y of [0.08, 0.45, 0.82]) { const r = new T.Mesh(new T.CylinderGeometry(0.315, 0.315, 0.04, 14), M().iron); r.position.set(x, y, z); G.scene.add(r); }
    G.addBoxCollider(x - 0.3, x + 0.3, 0, 0.9, z - 0.3, z + 0.3);
  }
  const block = (x0, x1, y0, y1, z0, z1, mat) => G.B(x0, x1, y0, y1, z0, z1, mat || M().concreteDark, { grime: false });
  function barrier(x, z, ry) {                                       // plot de béton bas, à enjamber (aligné sur un axe pour pouvoir être franchi)
    const alongX = Math.abs(Math.sin(ry)) < 0.7, w = alongX ? 2.2 : 0.6, d = alongX ? 0.6 : 2.2;
    block(x - w / 2, x + w / 2, 0, 0.85, z - d / 2, z + d / 2, M().concreteDark);
  }
  function wreck(x, z, ry) {                                          // épave de voiture rouillée (carrosserie, habitacle, roues)
    const g = new T.Group(); g.position.set(x, 0, z); g.rotation.y = ry;
    const add = (geo, mat, px, py, pz, rz) => { const m = new T.Mesh(geo, mat); m.position.set(px, py, pz); if (rz) m.rotation.z = rz; g.add(m); return m; };
    add(new T.BoxGeometry(4.2, 0.75, 1.8), M().metal, 0, 0.62, 0); add(new T.BoxGeometry(2.1, 0.7, 1.6), M().metal, -0.3, 1.3, 0);
    add(new T.BoxGeometry(1.9, 0.5, 1.62), M().glass, -0.3, 1.34, 0);
    for (const [px, pz] of [[1.4, 0.9], [1.4, -0.9], [-1.4, 0.9], [-1.4, -0.9]]) { const w = add(new T.CylinderGeometry(0.34, 0.34, 0.25, 12), M().iron, px, 0.34, pz); w.rotation.x = Math.PI / 2; }
    G.scene.add(g); G.addOBBCollider(x, z, 4.2, 1.8, ry, 0, 1.05);
  }
  function tree(x, z) {                                               // arbre mort : tronc effilé + branches
    const g = new T.Group(); g.position.set(x, 0, z); const mat = M().iron;
    const trunk = new T.Mesh(new T.CylinderGeometry(0.1, 0.22, 4.5, 7), mat); trunk.position.y = 2.25; g.add(trunk);
    for (let i = 0; i < 6; i++) {
      const a = i * 1.05 + G.rnd(), L = 1.4 + G.rnd() * 1.4, br = new T.Mesh(new T.CylinderGeometry(0.02, 0.07, L, 5), mat);
      br.position.set(Math.cos(a) * L * 0.3, 3.2 + G.rnd() * 1.3, Math.sin(a) * L * 0.3); br.rotation.set(Math.sin(a) * 0.9, 0, -Math.cos(a) * 0.9); g.add(br);
    }
    G.scene.add(g); G.addBoxCollider(x - 0.2, x + 0.2, 0, 4.5, z - 0.2, z + 0.2);
  }
  function fountain(x, z) {                                           // fontaine à sec : bassin bas, pilier, lampe
    const ring = new T.Mesh(new T.CylinderGeometry(2.7, 2.9, 0.7, 16, 1, true), M().concreteDark); ring.material = M().concreteDark.clone(); ring.material.side = T.DoubleSide; ring.position.set(x, 0.35, z); G.scene.add(ring);
    const lip = new T.Mesh(new T.TorusGeometry(2.8, 0.14, 6, 20), M().concrete); lip.rotation.x = Math.PI / 2; lip.position.set(x, 0.72, z); G.scene.add(lip);
    const water = new T.Mesh(new T.CircleGeometry(2.7, 16), M().puddle); water.rotation.x = -Math.PI / 2; water.position.set(x, 0.3, z); G.scene.add(water);
    const col = new T.Mesh(new T.CylinderGeometry(0.28, 0.4, 2.2, 10), M().concreteDark); col.position.set(x, 1.1, z); G.scene.add(col);
    for (let i = 0; i < 14; i++) { const a = i / 14 * 6.283, b = (i + 1) / 14 * 6.283; G.addSegCollider(x + Math.cos(a) * 2.9, z + Math.sin(a) * 2.9, x + Math.cos(b) * 2.9, z + Math.sin(b) * 2.9, 0, 0.75); }
    G.addBoxCollider(x - 0.4, x + 0.4, 0, 2.2, z - 0.4, z + 0.4);
    G.addLamp({ x, y: 2.5, z, color: 0xffa44a, I: 0.9, dist: 14, halo: 5, fogHalo: true, flicker: 0.12 });
  }
  function gate(cx, cz, dirx, dirz, hw) {                              // grille fermée en travers d'une ruelle
    const px = -dirz, pz = dirx, ang = Math.atan2(px, pz), bars = [];
    G.addSegCollider(cx - px * hw, cz - pz * hw, cx + px * hw, cz + pz * hw, 0, 3.2);
    const cyl = new T.CylinderGeometry(0.02, 0.02, 3.0, 5), im = new T.InstancedMesh(cyl, M().iron, Math.round(hw * 2 / 0.14)), d = new T.Object3D();
    for (let i = 0; i < im.count; i++) { const s = -hw + i * 0.14; d.position.set(cx + px * s, 1.5, cz + pz * s); d.updateMatrix(); im.setMatrixAt(i, d.matrix); }
    G.scene.add(im);
    for (const y of [0.1, 1.5, 2.95]) { const r = new T.Mesh(new T.BoxGeometry(hw * 2, 0.06, 0.06), M().iron); r.position.set(cx, y, cz); r.rotation.y = Math.atan2(-pz, px); G.scene.add(r); }
  }
  function crate(x, z, s, h) { const m = new T.Mesh(new T.BoxGeometry(s, h, s), M().wood); m.position.set(x, h / 2, z); G.scene.add(m); G.addBoxCollider(x - s / 2, x + s / 2, 0, h, z - s / 2, z + s / 2); }

  function buildProps() {
    // Lampadaires le long des ruelles (un côté puis l'autre)
    ALLEYS.forEach((a, k) => {
      const L = alleyLen(a);
      for (let d = 7 + (k % 3) * 2, n = 0; d < L - 3; d += 14, n++) {
        const p = alleyPoint(a, d), s = (n % 2 ? 1 : -1), off = a.w - 0.55;
        lamp(p.x - p.dz * off * s, p.z + p.dx * off * s, p.x, p.z, 0xffa44a, 0.95, 5.5, (k + n) % 7 === 3 ? 0.5 : 0);
      }
    });
    // Zone plate : lampadaires isolés, épaves, arbres morts, abribus, clôture
    for (const [c, r] of [[44, 10], [50, 15], [56, 22], [48, 3], [52, 8]]) { const q = A(c, r); lamp(q[0], q[1], q[0] - 1, q[1], 0xffb060, 0.85, 6, (c + r) % 3 === 0 ? 0.35 : 0); }
    for (const [c, r, ry] of [[46, 12, 0.5], [52, 20, 2.2], [45, 26, 1.1], [50, 6, 0.2]]) { const q = A(c, r); wreck(q[0], q[1], ry); }
    for (const [c, r] of [[47, 17], [53, 9], [58, 14], [43, 21], [55, 27], [51, 24], [49, 12], [56, 5], [45, 5], [57, 19]]) { const q = A(c, r); tree(q[0], q[1]); }
    { const q = A(42, 8); block(q[0] - 1.6, q[0] + 1.6, 2.4, 2.55, q[1] - 0.6, q[1] + 0.6, M().iron); for (const dx of [-1.5, 1.5]) block(q[0] + dx - 0.05, q[0] + dx + 0.05, 0, 2.4, q[1] - 0.5, q[1] - 0.4, M().iron); block(q[0] - 1.2, q[0] + 1.2, 0.4, 0.5, q[1] + 0.3, q[1] + 0.55, M().iron); }   // abribus
    { const a = A(62, 11), b = A(62, 18), im = new T.InstancedMesh(new T.CylinderGeometry(0.03, 0.03, 2.4, 5), M().iron, 60), d = new T.Object3D();   // clôture au loin
      for (let i = 0; i < 60; i++) { d.position.set(a[0], 1.2, a[1] + (b[1] - a[1]) * i / 59); d.updateMatrix(); im.setMatrixAt(i, d.matrix); } G.scene.add(im);
      G.addSegCollider(a[0], a[1], b[0], b[1], 0, 2.4); block(a[0] - 0.05, a[0] + 0.05, 2.3, 2.4, a[1], b[1], M().iron); }

    // Place : fontaine, corps du premier choc
    { const q = A(20, 12); fountain(q[0], q[1]); }
    { const a = ALLEYS[2], s = side(a, alleyLen(a) * 0.36, 1.1); G.buildBody(s[0], s[1], s[2] + 1.4); }

    // Ruelle de la tour : barrière à enjamber, tonneaux, caisses
