<meta charset="utf-8">
<title>Paris 2193</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; --bg: #07090a; --fg: #b4bcbc; --dim: #626b6c; --hot: #c9d3cc; --line: #2a3132; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; font-family: "Courier New", ui-monospace, monospace; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: var(--bg); }
  /* --- Éléments discrets pendant le jeu --- */
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 5; }
  #title { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 6; pointer-events: none; opacity: 0;
    letter-spacing: .5em; font-size: clamp(1.1rem, 3.2vw, 2rem); color: var(--hot); }
  #prompt, #caption, #hint { position: fixed; left: 0; right: 0; text-align: center; pointer-events: none; z-index: 4; opacity: 0; transition: opacity .6s;
    padding: 0 max(16px, env(safe-area-inset-left, 0px)); text-shadow: 0 0 6px #000, 0 0 2px #000; }
  #prompt { bottom: 28%; font-size: .95rem; letter-spacing: .12em; color: var(--hot); }
  #caption { bottom: 14%; font-size: .95rem; color: var(--fg); }
  #hint { bottom: 6%; font-size: .78rem; letter-spacing: .1em; color: var(--dim); }
  /* --- Menu --- */
  #menu, #enter { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; text-align: center;
    background: radial-gradient(ellipse at 50% 60%, #1c2325 0%, #0b0e0f 62%, #050606 100%);
    padding: 1rem max(16px, env(safe-area-inset-left, 0px)); }
  #menu[hidden], #enter[hidden], .panel[hidden] { display: none; }
  #grain { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .06; image-rendering: pixelated; pointer-events: none; }
  h1 { margin: 0 0 .4rem; font-weight: 400; letter-spacing: .45em; font-size: clamp(2rem, 8vw, 4.4rem); color: var(--hot); text-indent: .45em;
    animation: flick 7s infinite; }
  @keyframes flick { 0%, 92%, 100% { opacity: 1 } 93% { opacity: .35 } 94% { opacity: .9 } 95% { opacity: .2 } 96% { opacity: 1 } }
  .sub { color: var(--dim); font-size: .8rem; letter-spacing: .3em; margin: 0 0 1.4rem; }
  .panel { position: relative; display: flex; flex-direction: column; align-items: center; gap: .9rem; min-width: min(22rem, 100%); }
  button { font: inherit; background: none; color: var(--fg); border: 1px solid var(--line); padding: .65rem 2.2rem; letter-spacing: .3em; font-size: .85rem; cursor: pointer; min-width: 14rem; }
  button:hover, button:focus-visible { color: #000; background: var(--hot); border-color: var(--hot); outline: none; }
  .row { display: flex; align-items: center; justify-content: center; gap: .6rem; flex-wrap: wrap; font-size: .8rem; letter-spacing: .12em; }
  .row label { min-width: 8.5rem; text-align: right; color: var(--dim); }
  .row button { min-width: 0; padding: .35rem .8rem; letter-spacing: .1em; }
  .row button.on { color: #000; background: var(--hot); border-color: var(--hot); }
  input[type=range] { accent-color: #8fa39a; width: 9rem; }
  #bar { width: min(22rem, 80vw); height: 3px; background: var(--line); }
  #bar i { display: block; height: 100%; width: 0; background: var(--hot); transition: width .2s; }
  #loadmsg { color: var(--dim); font-size: .8rem; letter-spacing: .15em; min-height: 1.2em; }
  #enter-text { font-size: clamp(1.2rem, 4vw, 2rem); letter-spacing: .4em; color: var(--hot); }
  #enter-sub { color: var(--dim); font-size: .8rem; letter-spacing: .25em; animation: blink 2.4s infinite; }
  @keyframes blink { 50% { opacity: .25 } }
  #ver { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 12px; color: var(--dim); font-size: .7rem; letter-spacing: .15em; }
  @media (prefers-reduced-motion: reduce) { h1, #enter-sub { animation: none; } }

<!-- Three.js : moteur 3D (version fixe, chargée depuis un CDN) -->
<script>window.G = { loaded: [] };</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---- js/core.js ---- */
/* =====================================================================
   core.js : outils partagés (réglages, aléatoire, bruit).
   Tous les fichiers du jeu partagent un seul objet global : G.
   Chaque fichier ajoute ses fonctions à G, rien ne s'exécute avant G.boot().
   ===================================================================== */
(function () {
  'use strict';
  const G = window.G = window.G || { loaded: [] };
  G.T = window.THREE;

  // --- Réglages du joueur (sauvegardés dans le navigateur si possible) ---
  G.settings = { quality: 'medium', sens: 1, volume: 0.9 };
  G.loadSettings = function () {
    try { Object.assign(G.settings, JSON.parse(localStorage.getItem('paris2193') || '{}')); } catch (e) { /* pas grave */ }
  };
  G.saveSettings = function () {
    try { localStorage.setItem('paris2193', JSON.stringify(G.settings)); } catch (e) { /* pas grave */ }
  };

  // --- Aléatoire à graine : le monde est toujours identique d'une partie à l'autre ---
  let _s = 1337;
  G.rnd = function () {
    _s |= 0; _s = _s + 0x6D2B79F5 | 0;
    let t = Math.imul(_s ^ _s >>> 15, 1 | _s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  G.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  G.lerp = (a, b, t) => a + (b - a) * t;
  G.smooth = t => t * t * (3 - 2 * t);
  G.hash2 = (a, b) => { const h = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return h - Math.floor(h); };

  // --- Bruit "doux" qui se répète sans couture : base de toutes les saletés des textures ---
  G.makeNoise = function (S, cells, seed) {
    let s = seed; const g = [];
    for (let i = 0; i < cells * cells; i++) { s = (s * 16807) % 2147483647; g.push(s / 2147483647); }
    return (x, y) => {
      const fx = x / S * cells, fy = y / S * cells, x0 = Math.floor(fx), y0 = Math.floor(fy);
      const tx = G.smooth(fx - x0), ty = G.smooth(fy - y0);
      const X0 = ((x0 % cells) + cells) % cells, X1 = (X0 + 1) % cells, Y0 = ((y0 % cells) + cells) % cells, Y1 = (Y0 + 1) % cells;
      const a = g[Y0 * cells + X0], b = g[Y0 * cells + X1], c = g[Y1 * cells + X0], d = g[Y1 * cells + X1];
      return (a + (b - a) * tx) * (1 - ty) + (c + (d - c) * tx) * ty;
    };
  };
  // Plusieurs bruits de tailles différentes superposés = taches naturelles
  G.fbm = function (S) {
    const a = G.makeNoise(S, 4, 11), b = G.makeNoise(S, 8, 23), c = G.makeNoise(S, 16, 37);
    return (x, y) => a(x, y) * 0.5 + b(x, y) * 0.3 + c(x, y) * 0.2;
  };
  // Fissures : marches aléatoires. Renvoie l'ensemble des pixels fissurés.
  G.crackSet = function (S, count, len) {
    const set = new Set();
    for (let n = 0; n < count; n++) {
      let x = Math.floor(G.rnd() * S), y = Math.floor(G.rnd() * S), a = G.rnd() * 6.28;
      for (let i = 0; i < len; i++) {
        a += (G.rnd() - 0.5) * 0.9;
        x = (x + Math.round(Math.cos(a)) + S) % S; y = (y + Math.round(Math.sin(a)) + S) % S;
        set.add(y * S + x);
      }
    }
    return set;
  };

  G.loaded.push('core');
})();

</script>
<script>
/* ---- js/render.js ---- */
/* =====================================================================
   render.js : le rendu "vieil écran + brouillard".
   1) La scène est dessinée dans une petite image (ex. 324 pixels de haut).
   2) Un filtre plein écran l'agrandit en l'adoucissant, puis ajoute :
      flou léger, halo sur les lumières, couleurs ternes, grain, lignes de balayage, bords sombres.
   Moins de pixels à calculer = jeu fluide ; et le flou cache les limites du navigateur.
   ===================================================================== */
(function () {
  'use strict';
  const G = window.G, T = G.T;
  const QUALITY_HEIGHT = { low: 240, medium: 324, high: 432 };

  const VERT = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position, 1.0); }`;
  const FRAG = `
    uniform sampler2D tDiffuse; uniform vec2 texel; uniform float lines; uniform float time; uniform float flash;
    varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){
      vec2 c = vUv - 0.5; float r2 = dot(c, c);
      vec2 off = c * r2 * 0.02;                                  // décalage des couleurs sur les bords (vieille optique)
      vec3 col = vec3(texture2D(tDiffuse, vUv + off).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - off).b);
      vec2 t = texel * 1.6;                                      // flou : moyenne avec les voisins
      vec3 blur = (texture2D(tDiffuse, vUv + vec2(t.x, 0.)).rgb + texture2D(tDiffuse, vUv - vec2(t.x, 0.)).rgb
                 + texture2D(tDiffuse, vUv + vec2(0., t.y)).rgb + texture2D(tDiffuse, vUv - vec2(0., t.y)).rgb) * 0.25;
      col = mix(col, blur, 0.5);
      vec2 t2 = texel * 5.0;                                     // halo : les zones claires débordent
      vec3 wide = (texture2D(tDiffuse, vUv + vec2(t2.x, t2.y)).rgb + texture2D(tDiffuse, vUv - vec2(t2.x, t2.y)).rgb
                 + texture2D(tDiffuse, vUv + vec2(-t2.x, t2.y)).rgb + texture2D(tDiffuse, vUv - vec2(-t2.x, t2.y)).rgb) * 0.25;
      col += max(wide - 0.32, 0.0) * 0.75;
      float l = dot(col, vec3(0.299, 0.587, 0.114));            // couleurs ternes, teinte froide un peu verdâtre
      col = mix(vec3(l), col, 0.62) * vec3(0.93, 1.0, 0.95);
      col = pow(max(col, 0.0), vec3(1.0)) + 0.016;
      col *= 0.955 + 0.045 * sin(vUv.y * lines * 6.2832);        // lignes de balayage
      col += (hash(gl_FragCoord.xy + fract(time) * 71.0) - 0.5) * 0.085;   // grain
      col *= smoothstep(0.98, 0.22, length(c) * 1.35);           // bords sombres
      col += flash;
      gl_FragColor = vec4(col, 1.0);
    }`;

  G.initRender = function (canvas) {
    G.renderer = new T.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
    G.renderer.setPixelRatio(1);
    G.scene = new T.Scene();
    G.camera = new T.PerspectiveCamera(70, 16 / 9, 0.05, 90);
    G.camera.rotation.order = 'YXZ';        // d'abord gauche/droite, ensuite haut/bas
    G.postScene = new T.Scene();
    G.postCam = new T.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    G.postMat = new T.ShaderMaterial({
      uniforms: { tDiffuse: { value: null }, texel: { value: new T.Vector2(1 / 576, 1 / 324) }, lines: { value: 324 }, time: { value: 0 }, flash: { value: 0 } },
      vertexShader: VERT, fragmentShader: FRAG, depthTest: false, depthWrite: false
    });
    G.postScene.add(new T.Mesh(new T.PlaneGeometry(2, 2), G.postMat));
    window.addEventListener('resize', G.resize);
    G.resize();
  };

  G.resize = function () {
    const w = window.innerWidth, h = window.innerHeight;
    const ih = QUALITY_HEIGHT[G.settings.quality] || 324, iw = Math.max(2, Math.round(ih * w / h));
    G.renderer.setSize(w, h, false);
    if (G.rt) G.rt.dispose();
    G.rt = new T.WebGLRenderTarget(iw, ih, { minFilter: T.LinearFilter, magFilter: T.LinearFilter, format: T.RGBAFormat });
    G.postMat.uniforms.tDiffuse.value = G.rt.texture;
    G.postMat.uniforms.texel.value.set(1 / iw, 1 / ih);
    G.postMat.uniforms.lines.value = ih;
    G.camera.aspect = w / h; G.camera.updateProjectionMatrix();
  };

  G.render = function (time) {
    G.postMat.uniforms.time.value = time;
    G.renderer.setRenderTarget(G.rt);
    G.renderer.render(G.scene, G.camera);
    G.renderer.setRenderTarget(null);
    G.renderer.render(G.postScene, G.postCam);
  };

  G.loaded.push('render');
})();

</script>
<script>
/* ---- js/textures.js ---- */
/* =====================================================================
   textures.js : matières dessinées par code (128x128), volontairement un peu floues.
   Brutalisme : béton gris coulé dans des coffrages (joints + trous de tirants), taches, coulures.
   Les textures sont adoucies (filtrage linéaire) : pas de gros pixels carrés, une matière brute et molle.
   ===================================================================== */
(function () {
  'use strict';
  const G = window.G, T = G.T;

  // Fabrique une texture à partir d'une fonction (x, y) -> [r, g, b]
  G.makeTexture = function (S, fn) {
    const data = new Uint8ClampedArray(S * S * 4);
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
      const p = fn(x, y), i = (y * S + x) * 4;
      data[i] = p[0]; data[i + 1] = p[1]; data[i + 2] = p[2]; data[i + 3] = 255;
    }
    const c = document.createElement('canvas'); c.width = c.height = S;
    c.getContext('2d').putImageData(new ImageData(data, S, S), 0, 0);
    const t = new T.CanvasTexture(c);
    t.magFilter = T.LinearFilter; t.minFilter = T.LinearMipmapLinearFilter;
    t.wrapS = t.wrapT = T.RepeatWrapping;
    t.anisotropy = G.renderer ? G.renderer.capabilities.getMaxAnisotropy() : 1;
    return t;
  };

  // Béton coffré : un panneau de 2,5 m avec joints sur les bords et 4 trous de tirants, grain fin, taches, coulures.
  function concreteFn(S, tint, stain) {
    const f = G.fbm(S), f2 = G.makeNoise(S, 32, 5), f3 = G.makeNoise(S, 64, 9), cr = G.crackSet(S, 3, 40);
    const holes = [[S * 0.25, S * 0.25], [S * 0.75, S * 0.25], [S * 0.25, S * 0.75], [S * 0.75, S * 0.75]];
    return (x, y) => {
      let m = (0.5 + f(x, y) * 0.8) * (0.9 + (f3(x, y) - 0.5) * 0.4 + (G.rnd() - 0.5) * 0.12) * stain;
      if (G.hash2(Math.floor(x / 2), 7) > 0.8) m *= 0.75 + 0.25 * f2(x * 0.3, y);      // coulures d'eau
      if (x < 2 || y < 2) m *= 0.55;                                                    // joints du coffrage
      for (const h of holes) { const d = Math.hypot(x - h[0], y - h[1]); if (d < 3.4) m *= d < 2 ? 0.3 : 0.65; }   // trous de tirants
      if (cr.has(y * S + x)) m *= 0.45;
      return [104 * m * tint[0], 106 * m * tint[1], 104 * m * tint[2]];
    };
  }
  // Asphalte : très sombre, gravillons, fissures, taches
  function asphaltFn(S) {
    const f = G.fbm(S), cr = G.crackSet(S, 7, 70);
    return (x, y) => {
      let m = (0.55 + f(x, y) * 0.7) * (0.85 + G.rnd() * 0.3);
      if (G.rnd() < 0.03) m *= 1.8;
      if (cr.has(y * S + x)) m *= 0.4;
      return [50 * m, 52 * m, 54 * m];
    };
  }
  // Métal rouillé gris (tonneaux, rambardes)
  function metalFn(S) {
    const f = G.fbm(S), f2 = G.makeNoise(S, 32, 3);
    return (x, y) => {
      const g = f(x, y), q = 0.6 + f2(x, y) * 0.7;
      let r = 78 * q, gg = 80 * q, b = 80 * q;
      if (g > 0.55) { const k = 0.7 + f2(x, y) * 0.8; r = 105 * k; gg = 66 * k; b = 44 * k; }   // rouille
      if (G.hash2(Math.floor(x / 2), 9) > 0.86) { r *= 0.6; gg *= 0.6; b *= 0.6; }               // coulures
      return [r, gg, b];
    };
  }
  // Peinture d'appartement : vert-gris sale qui s'écaille, laisse voir le béton dessous
  function paintFn(S) {
    const f = G.fbm(S), f2 = G.makeNoise(S, 16, 14), con = concreteFn(S, [1, 1, 1], 1);
    return (x, y) => {
      if (f(x + 20, y + 7) + (f2(x, y) - 0.5) * 0.25 < 0.36) return con(x, y);                  // peinture écaillée -> béton
      const m = (0.55 + f(x, y) * 0.8) * (0.92 + G.rnd() * 0.12);
      return [96 * m, 108 * m, 92 * m];
    };
  }
  // Sol usé : béton sombre verdâtre
  function floorFn(S) {
    const f = G.fbm(S), f2 = G.makeNoise(S, 32, 21);
    return (x, y) => {
      const m = (0.5 + f(x, y) * 0.7) * (0.9 + G.rnd() * 0.15) * (x % 64 < 1 || y % 64 < 1 ? 0.55 : 1);
      return [66 * m, 72 * m, 66 * m * (0.95 + f2(x, y) * 0.1)];
    };
  }

  // Neige d'écran cathodique : une petite image dont on redessine le bruit plusieurs fois par seconde
  G.makeStatic = function () {
    const c = document.createElement('canvas'); c.width = 64; c.height = 48;
    const g = c.getContext('2d'), img = g.createImageData(64, 48);
    const t = new T.CanvasTexture(c); t.magFilter = T.LinearFilter; t.minFilter = T.LinearFilter;
    let band = 0;
    return {
      texture: t,
      update(time) {
        band = (band + 1.7) % 48;
        for (let y = 0; y < 48; y++) for (let x = 0; x < 64; x++) {
          const i = (y * 64 + x) * 4, v = Math.random() * 150 + (Math.abs(y - band) < 3 ? 70 : 0);
          img.data[i] = v * 0.45; img.data[i + 1] = v; img.data[i + 2] = v * 0.78; img.data[i + 3] = 255;   // lueur verte
        }
        g.putImageData(img, 0, 0); t.needsUpdate = true;
      }
    };
  };

  // --- Matériaux (une seule fois). vertexColors = la "saleté cuite" dans la géométrie (voir world.js) ---
  G.buildMaterials = function () {
    const mk = (fn, o) => new T.MeshPhongMaterial(Object.assign({ map: G.makeTexture(128, fn), vertexColors: true, shininess: 3, specular: 0x111111 }, o || {}));
    G.mat = {
      concrete: mk(concreteFn(128, [1, 1, 1], 1)),
      concreteDark: mk(concreteFn(128, [0.8, 0.82, 0.82], 0.8)),
      wall: mk(paintFn(128)),                                                   // murs intérieurs de l'appartement
      floor: mk(floorFn(128)),
      asphalt: mk(asphaltFn(128), { shininess: 38, specular: 0x3a444c }),      // mouillé : accroche un peu la lumière
      metal: mk(metalFn(128), { shininess: 12, specular: 0x222222 }),
      dark: new T.MeshPhongMaterial({ color: 0x08090a, shininess: 2 }),
      iron: new T.MeshPhongMaterial({ color: 0x15171a, shininess: 20, specular: 0x333333 }),
      cloth: new T.MeshPhongMaterial({ color: 0x4b524a, shininess: 2 }),
      cloth2: new T.MeshPhongMaterial({ color: 0x6d7168, shininess: 2 }),
      plastic: new T.MeshPhongMaterial({ color: 0x3b3d3b, shininess: 14, specular: 0x222222 }),
      glass: new T.MeshPhongMaterial({ color: 0x1a2426, shininess: 90, specular: 0x8fa5ad, transparent: true, opacity: 0.35 })
    };
  };

  G.loaded.push('textures');
})();

</script>
<script>
/* ---- js/world.js ---- */
/* =====================================================================
   world.js : le décor. Tout est fait de boîtes (brutalisme = gros blocs) dont la matière est brute.
   Axes : X largeur, Y hauteur, Z profondeur. Le joueur démarre dans l'appartement (y = 9),
   descend 3 étages par l'escalier, sort du hall (z = -2.65) dans une rue où il avance vers -z.
   Fonction d'entrée : G.buildWorld()
   ===================================================================== */
(function () {
  'use strict';
  const G = window.G, T = G.T;
  G.colliders = []; G.lamps = []; G.interactables = []; G.animated = [];

  /* ---------------------------------------------------------------
     BRIQUES DE BASE
     --------------------------------------------------------------- */
  // Géométrie de boîte : UV calculées dans le MONDE (la matière se prolonge d'une boîte à l'autre, sans raccord)
  // + "saleté cuite" en couleurs de sommets : sombre près du sol, plus clair en haut. Aucune lumière dynamique nécessaire.
  function boxGeo(w, h, d, cx, cy, cz, tile, grime, base) {
    const g = new T.BoxGeometry(w, h, d, 1, G.clamp(Math.ceil(h / 0.8), 1, 18), 1);
    const p = g.attributes.position, n = g.attributes.normal, uv = g.attributes.uv, col = new Float32Array(p.count * 3);
    for (let i = 0; i < p.count; i++) {
      const wx = p.getX(i) + cx, wy = p.getY(i) + cy, wz = p.getZ(i) + cz;
      const ax = Math.abs(n.getX(i)), ay = Math.abs(n.getY(i)), az = Math.abs(n.getZ(i));
      if (ax >= ay && ax >= az) uv.setXY(i, wz / tile, wy / tile); else if (ay >= az) uv.setXY(i, wx / tile, wz / tile); else uv.setXY(i, wx / tile, wy / tile);
      let k = 1;
      if (grime) k = (0.5 + 0.5 * G.smooth(G.clamp((wy - base) / 1.8, 0, 1))) * (0.93 + 0.07 * G.hash2(wx * 3.1 + wz * 1.7, wy * 2.3));
      col[i * 3] = col[i * 3 + 1] = col[i * 3 + 2] = k;
    }
    g.setAttribute('color', new T.BufferAttribute(col, 3));
    return g;
  }
  // B(x0,x1, y0,y1, z0,z1, matériau, options) : une boîte définie par ses limites. Collision par défaut.
  G.B = function (x0, x1, y0, y1, z0, z1, mat, o) {
    o = o || {};
    const w = x1 - x0, h = y1 - y0, d = z1 - z0, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, cz = (z0 + z1) / 2;
    let mesh = null;
    if (!o.nomesh) {
      mesh = new T.Mesh(boxGeo(w, h, d, cx, cy, cz, o.tile || 2.5, o.grime !== false, o.grimeBase !== undefined ? o.grimeBase : y0), mat);
      mesh.position.set(cx, cy, cz); G.scene.add(mesh);
    }
    if (o.collide !== false) G.colliders.push({ minX: x0, maxX: x1, minY: y0, maxY: y1, minZ: z0, maxZ: z1 });
    return mesh;
  };
  // Mur avec ouvertures (portes, fenêtres). axis 'z' : épaisseur en z [c0,c1], longueur en x [a0,a1].
  // axis 'x' : épaisseur en x, longueur en z. openings : [a0, a1, y0, y1].
  G.wall = function (axis, c0, c1, a0, a1, y0, y1, openings, mat, o) {
    o = Object.assign({}, o || {}); o.grimeBase = y0; openings = openings || [];
    const br = new Set([a0, a1]); for (const op of openings) { br.add(op[0]); br.add(op[1]); }
    const bs = [...br].sort((a, b) => a - b);
    for (let i = 0; i < bs.length - 1; i++) {
      const p = bs[i], q = bs[i + 1]; if (q - p < 1e-6) continue;
      let spans = [[y0, y1]];
      for (const op of openings) if (op[0] <= p + 1e-6 && op[1] >= q - 1e-6) {
        const next = [];
        for (const s of spans) {
          if (op[3] <= s[0] || op[2] >= s[1]) next.push(s);
          else { if (op[2] > s[0]) next.push([s[0], op[2]]); if (op[3] < s[1]) next.push([op[3], s[1]]); }
        }
        spans = next;
      }
      for (const s of spans) { if (axis === 'z') G.B(p, q, s[0], s[1], c0, c1, mat, o); else G.B(c0, c1, s[0], s[1], p, q, mat, o); }
    }
  };
  G.glassPane = function (x0, x1, y0, y1, z0, z1) {   // vitre : transparente mais solide
    const m = new T.Mesh(new T.BoxGeometry(x1 - x0, y1 - y0, z1 - z0), G.mat.glass);
    m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2); G.scene.add(m);
    G.colliders.push({ minX: x0, maxX: x1, minY: y0, maxY: y1, minZ: z0, maxZ: z1 });
  };

  /* ---------------------------------------------------------------
     LUMIÈRES : beaucoup de lampes "émissives" (ampoule + halo), mais seules les 3 plus proches
     éclairent vraiment (3 vraies lumières déplacées). C'est ce qui garde le jeu fluide.
     --------------------------------------------------------------- */
  let glowTex = null;
  G.addLamp = function (o) {
    const L = { pos: new T.Vector3(o.x, o.y, o.z), color: new T.Color(o.color || 0xffc880), I: o.I || 1, dist: o.dist || 10,
      flicker: o.flicker || 0, level: 1, cur: 1, burst: 0, blink: 0, phase: Math.random() * 10, base: o.halo === undefined ? 1.6 : o.halo };
    if (o.bulb !== false) {
      L.bulb = new T.Mesh(new T.SphereGeometry(0.06, 8, 6), new T.MeshBasicMaterial({ color: L.color }));
      L.bulb.position.copy(L.pos); G.scene.add(L.bulb);
    }
    if (L.base > 0) {
      L.halo = new T.Sprite(new T.SpriteMaterial({ map: glowTex, color: L.color, blending: T.AdditiveBlending, transparent: true, depthWrite: false, opacity: 0.5, fog: o.fogHalo !== true }));
      L.halo.position.copy(L.pos); L.halo.scale.set(L.base, L.base, 1); G.scene.add(L.halo);
    }
    G.lamps.push(L); return L;
  };
  G.updateLamps = function (dt, time) {
    const cam = G.camera.position;
    for (const L of G.lamps) {
      if (L.flicker > 0) {                                   // panne par à-coups
        if (L.burst > 0) {
          L.burst -= dt; L.blink -= dt;
          if (L.blink <= 0) { L.blink = 0.03 + Math.random() * 0.07; L.cur = Math.random() < 0.55 ? 0.05 + Math.random() * 0.25 : 0.6 + Math.random() * 0.4; }
          if (L.burst <= 0) L.cur = 1;
        } else if (Math.random() < L.flicker * dt) { L.burst = 0.08 + Math.random() * 0.5; L.blink = 0; }
        L.level = L.cur * (0.94 + 0.06 * Math.sin(time * 50 + L.phase));
      }
      if (L.bulb) L.bulb.material.color.copy(L.color).multiplyScalar(0.25 + 0.75 * L.level);
      if (L.halo) L.halo.material.opacity = 0.5 * L.level;
      L.d2 = L.pos.distanceToSquared(cam);
    }
    const near = G.lamps.slice().sort((a, b) => a.d2 - b.d2);
    for (let i = 0; i < G.pool.length; i++) {
      const pl = G.pool[i], L = near[i];
      if (!L) { pl.intensity = 0; continue; }

    }
  };
  function radialTexture(stops) {
    const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); for (const s of stops) gr.addColorStop(s[0], s[1]);

  /* ---------------------------------------------------------------

  G.zoneAt = function (p) { return (p.x > -2.1 && p.x < 2.1 && p.z > -2.65 && p.z < 8.3) ? 'in' : 'out'; };

  /* ---------------------------------------------------------------
     LA TOUR : appartement (y=9) + escalier + hall
     --------------------------------------------------------------- */
  function buildTower() {
    const M = G.mat;
    // Coque en béton
    G.B(-2.1, -1.8, 0, 11.9, -2.65, 8.3, M.concrete);                        // mur ouest
    G.B(1.8, 2.1, 0, 11.9, -2.65, 8.3, M.concrete);                          // mur est
    G.B(-2.1, 2.1, 0, 11.9, 8.0, 8.3, M.concrete);                           // mur du fond
    G.B(-2.1, 2.1, 11.6, 11.9, -2.65, 8.3, M.concreteDark, { grime: false }); // toit / plafond
    // Façade : porte du hall (en bas) et fenêtre de l'appartement (en haut, sur la rue)
    G.wall('z', -2.65, -2.35, -2.1, 2.1, 0, 11.9, [[-1.6, -0.4, 0, 2.3], [-0.5, 1.3, 10.0, 11.2]], M.concrete);
    G.glassPane(-0.5, 1.3, 10.0, 11.2, -2.52, -2.48);
    // Cloison entre l'appartement/hall et la cage d'escalier, avec deux portes (hall en bas, appartement en haut)
    G.wall('z', 3.0, 3.3, -2.1, 2.1, 0, 11.9, [[-1.3, -0.3, 0, 2.2], [-1.3, -0.3, 9, 11.1]], M.wall);
    // Masse pleine sous l'appartement (étages des voisins) : sa face du haut est le sol de l'appartement
    G.B(-1.8, 1.8, 3.0, 9.0, -2.35, 3.0, M.floor, { tile: 2, grime: false });
    G.B(-1.8, 1.8, -0.3, 0, -2.35, 8.0, M.floor, { tile: 2, grime: false });   // sol du hall et de l'escalier

    // --- Escalier : 3 étages, chacun = 2 volées de 8 marches (0,1875 m de haut) autour d'un palier ---
    const RISE = 0.1875, RUN = 0.275;
    for (const yf of [9, 6, 3]) {
      G.B(-1.8, 1.8, yf - 0.3, yf, 3.3, 4.7, M.concreteDark, { grime: false });                // palier d'étage (nord)
      G.B(-1.8, 1.8, yf - 1.8, yf - 1.5, 6.9, 8.0, M.concreteDark, { grime: false });          // palier intermédiaire (sud)
      for (let i = 1; i <= 8; i++) {                                                            // volée est : on descend vers le sud
        const top = yf - RISE * i, z0 = 4.7 + (i - 1) * RUN;
        G.B(0.1, 1.8, top - 0.3, top, z0, z0 + RUN, M.concreteDark, { grime: false });
      }
      for (let j = 1; j <= 8; j++) {                                                            // volée ouest : on redescend vers le nord
        const top = yf - 1.5 - RISE * j, z1 = 6.9 - (j - 1) * RUN;
        G.B(-1.8, -0.1, top - 0.3, top, z1 - RUN, z1, M.concreteDark, { grime: false });
      }
    }
    // Lampes de palier : fatiguées, vert-jaune, certaines grésillent
    [[9, 0.05], [6, 0.35], [3, 0.5], [0, 0.15]].forEach(([yf, fl]) => G.addLamp({ x: 0, y: yf + 2.25, z: 3.9, color: 0xcfd8a0, I: 1.7, dist: 9, flicker: fl, halo: 1.0 }));
    G.addLamp({ x: 0, y: 2.6, z: 0.4, color: 0xb9c8a8, I: 1.2, dist: 8, flicker: 0.3, halo: 0.9 });   // hall

    buildApartment();
  }

  /* ---------------------------------------------------------------
     LA RUE : un canyon de blocs brutalistes, des lampadaires faibles, quelques obstacles à franchir
     --------------------------------------------------------------- */
  function buildStreet() {
    const M = G.mat;
    G.B(-20, 20, -1, 0, -76, -2.65, M.asphalt, { tile: 3, grime: false });                                   // chaussée
    G.B(-6, -2.1, 0, 20, -2.65, 8.3, M.concrete); G.B(2.1, 6, 0, 20, -2.65, 8.3, M.concrete);                 // ailes de la tour
    G.B(-20, -6, 0, 24, -76, -2.65, M.concrete, { tile: 2.5 }); G.B(6, 20, 0, 24, -76, -2.65, M.concrete, { tile: 2.5 });   // grands blocs
    G.B(-20, 20, 0, 24, -78, -76, M.concreteDark);                                                          // fond de la rue (fermé)

      const dark = spots.filter(() => G.rnd() > 0.15), lit = dark.filter(() => G.rnd() < 0.05);

    for (const z of [-20, -27, -33.6, -38, -48.6]) G.B(-4.7, -4.3, 0, 2.9, z - 0.2, z + 0.2, M.concrete);

    G.B(3.0, 4.6, 0, 0.7, -40, -38, M.concrete); G.B(-3.6, -2.2, 0, 0.5, -8, -6.5, M.concreteDark); G.B(2.6, 4.2, 0, 0.45, -8, -6.8, M.concreteDark);
    // Tonneaux (gardés tels quels : cylindres rouillés à cerclages)
    for (const [x, z] of [[4.5, -11], [5.1, -11.7], [-4.2, -40], [-3.5, -40.6], [0.5, -56]]) {
      const b = new T.Mesh(new T.CylinderGeometry(0.3, 0.3, 0.9, 14), M.metal); b.position.set(x, 0.45, z); G.scene.add(b);
      for (const y of [0.08, 0.45, 0.82]) { const r = new T.Mesh(new T.CylinderGeometry(0.315, 0.315, 0.04, 14), M.iron); r.position.set(x, y, z); G.scene.add(r); }
      G.colliders.push({ minX: x - 0.3, maxX: x + 0.3, minY: 0, maxY: 0.9, minZ: z - 0.3, maxZ: z + 0.3 });

    });
  }

  /* ---------------------------------------------------------------

  function ball(group, mat, p, r, sx, sy, sz, seg) {

  function buildBody() {

    ball(g, jacket, [0, 0.14, -0.14], 0.27, 1.0, 0.5, 0.95); ball(g, jacket, [0, 0.12, 0.2], 0.23, 1.0, 0.5, 1.0); ball(g, pants, [0, 0.11, 0.42], 0.17, 1.15, 0.7, 0.8);
    ball(g, jacket, [0.3, 0.13, -0.3], 0.1); ball(g, jacket, [-0.3, 0.13, -0.3], 0.1);

<script>
/* ---- js/player.js ---- */
/* =====================================================================
   player.js : déplacement en première personne, collisions, mouvements de caméra.
   Marche LENTE (2,5 m/s), course nettement plus rapide (6,4 m/s) : la caméra balance, penche, tremble.
   ===================================================================== */
(function () {
  'use strict';
  const G = window.G, T = G.T;
  const R = 0.35, HEIGHT = 1.75, GRAVITY = 20, JUMP = 7.2, WALK = 2.5, RUN = 6.4, EYE = 1.62;
  G.keys = {};
  G.P = null;

  G.initPlayer = function () {
    // Départ : dans l'appartement, entre le lit et le bureau, face à la fenêtre (vers -z)
    G.P = { pos: new T.Vector3(0.1, 9.0, 0.9), vx: 0, vz: 0, vy: 0, yaw: 0, pitch: 0, onGround: true,
            stepDist: 0, lastStep: 0, bobAmp: 0, eye: 9.0 + EYE, exert: 0, dip: 0, fov: 70, moving: 0, sprint: false };
    G.updateCamera(0, 0);
  };

  // Renvoie la boîte touchée à cette position (cylindre du joueur approché par un carré), ou null
  function hit(x, y, z) {
    const c = G.colliders;
    for (let i = 0; i < c.length; i++) {
      const b = c[i];
      if (x + R > b.minX && x - R < b.maxX && z + R > b.minZ && z - R < b.maxZ && y + HEIGHT > b.minY + 0.001 && y < b.maxY - 0.001) return b;
    }
    return null;
  }

  G.updatePlayer = function (dt) {
    const P = G.P, k = G.keys, p = P.pos;
    // 1) Direction voulue (touches PHYSIQUES : ZQSD sur AZERTY = WASD)
    let fx = 0, fz = 0;
    if (k.KeyW || k.ArrowUp) fz -= 1; if (k.KeyS || k.ArrowDown) fz += 1;
    if (k.KeyA || k.ArrowLeft) fx -= 1; if (k.KeyD || k.ArrowRight) fx += 1;
    const len = Math.hypot(fx, fz) || 1; fx /= len; fz /= len;
    const sin = Math.sin(P.yaw), cos = Math.cos(P.yaw);
    const wishX = fx * cos + fz * sin, wishZ = -fx * sin + fz * cos;
    const wants = (fx || fz) !== 0;
    P.sprint = wants && (k.ShiftLeft || k.ShiftRight) && fz <= 0;
    const speed = P.sprint ? RUN : WALK;
    const acc = Math.min(1, (P.onGround ? (P.sprint ? 7 : 9) : 1.5) * dt);       // on démarre un peu mollement
    P.vx += (wishX * speed - P.vx) * acc; P.vz += (wishZ * speed - P.vz) * acc;

    // 2) Saut
    let jumped = false;
    if (k.Space && P.onGround) { P.vy = JUMP; P.onGround = false; jumped = true; }

    // 3) Déplacement axe par axe (on glisse le long des murs) ; petites marches franchies automatiquement
    for (const axis of ['x', 'z']) {
      const nx = axis === 'x' ? p.x + P.vx * dt : p.x, nz = axis === 'z' ? p.z + P.vz * dt : p.z;
      const b = hit(nx, p.y, nz);
      if (!b) { p.x = nx; p.z = nz; }
      else if (b.maxY - p.y <= 0.45 && !hit(nx, b.maxY, nz)) { p.x = nx; p.z = nz; p.y = b.maxY; }
      else if (axis === 'x') P.vx = 0; else P.vz = 0;
    }
    // 4) En descendant un escalier, on "colle" au sol (sinon on rebondirait de marche en marche)
    if (P.onGround && !jumped) {
      let best = -1e9;
      for (const b of G.colliders) if (p.x + R > b.minX && p.x - R < b.maxX && p.z + R > b.minZ && p.z - R < b.maxZ && b.maxY <= p.y + 0.001 && b.maxY >= p.y - 0.32) best = Math.max(best, b.maxY);
      if (best > -1e8 && best < p.y) p.y = best;
    }
    // 5) Gravité et sol
    const wasAir = !P.onGround, fall = P.vy;
    P.vy -= GRAVITY * dt;
    let ny = p.y + P.vy * dt; P.onGround = false;
    const hb = hit(p.x, ny, p.z);
    if (hb) { if (P.vy <= 0) { ny = hb.maxY; P.onGround = true; } else ny = p.y; P.vy = 0; }
    p.y = ny;
    if (p.y < -8) { p.set(0.1, 9.0, 0.9); P.vy = 0; P.eye = 9 + EYE; }      // sécurité : tombé dans le vide
    if (wasAir && P.onGround && fall < -3) { P.dip = G.clamp(-fall / 55, 0.03, 0.2); G.audio.thud(G.clamp(-fall / 14, 0.1, 0.5), 70, 0.25); }

    // 6) Pas : un bruit à chaque foulée, plus espacés en marchant, plus rapprochés en courant
    const horiz = Math.hypot(P.vx, P.vz);
    P.moving = G.lerp(P.moving, P.onGround && horiz > 0.4 ? 1 : 0, Math.min(1, dt * 8));
    if (P.onGround && horiz > 0.4) {
      P.stepDist += horiz * dt;
      const stride = P.sprint ? 1.55 : 0.8, n = Math.floor(P.stepDist / stride);
      if (n > P.lastStep) { G.audio.footstep(P.sprint, G.zoneAt(p)); }
      P.lastStep = n;
    }
    P.exert = G.clamp(P.exert + (P.sprint && horiz > 3 ? 0.2 : -0.07) * dt, 0, 1);
    return horiz;
  };

  // Caméra : yeux à 1,62 m, balancement de marche, inclinaison en course, respiration, léger "creux" à l'atterrissage
  G.updateCamera = function (dt, time) {
    const P = G.P, cam = G.camera, horiz = Math.hypot(P.vx, P.vz);
    const rate = P.onGround ? 15 : 70;                                   // lisse les marches d'escalier
    P.eye += (P.pos.y + EYE - P.eye) * Math.min(1, rate * dt);
    P.dip = Math.max(0, P.dip - dt * 0.5);
    const targetAmp = P.onGround ? G.clamp(horiz / RUN, 0, 1) : 0;
    P.bobAmp = G.lerp(P.bobAmp, targetAmp, Math.min(1, dt * 6));
    const stride = P.sprint ? 1.55 : 0.8, phase = P.stepDist / stride * Math.PI;
    const run = P.sprint ? 1 : 0.4;
    const bobY = Math.abs(Math.sin(phase)) * (0.035 + run * 0.05) * P.bobAmp;
    const bobX = Math.sin(phase) * (0.02 + run * 0.025) * P.bobAmp;
    const roll = Math.sin(phase) * (0.006 + run * 0.012) * P.bobAmp;
    const breath = Math.sin(time * 1.1) * 0.004 * (1 + P.exert * 2.5);
    cam.position.set(P.pos.x + Math.cos(P.yaw) * bobX, P.eye + bobY + breath - P.dip, P.pos.z - Math.sin(P.yaw) * bobX);
    cam.rotation.set(P.pitch - bobY * 0.12, P.yaw, roll);
    const fovT = 70 + (P.sprint ? 7 : 0) * P.bobAmp;
    if (Math.abs(cam.fov - fovT) > 0.05) { cam.fov += (fovT - cam.fov) * Math.min(1, dt * 5); cam.updateProjectionMatrix(); }
  };

  G.loaded.push('player');
})();

</script>
<script>
/* ---- js/audio.js ---- */
/* =====================================================================
   audio.js : tous les sons sont générés par code (Web Audio), aucun fichier.
   Le son change selon le lieu : étouffé et plein d'écho dans l'escalier, ouvert et venteux dehors.
   ===================================================================== */
(function () {
  'use strict';
  const G = window.G;
  let ac = null, master, musicBus, ambBus, sfxBus, outFilter, windGain, windFilter, revSend, reverb, noiseBuf, breathGain, crtGain;
  let musicOn = true, breathPhase = 0;

  const A = G.audio = {
    // Ces fonctions ne font rien tant que l'audio n'est pas démarré (il faut un clic du joueur d'abord)
    footstep() {}, thud() {}, flick() {}, update() {}
  };

  A.init = function () {
    if (ac) return;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC(); A.ctx = ac;
    master = ac.createGain(); master.gain.value = G.settings.volume; master.connect(ac.destination);
    musicBus = ac.createGain(); musicBus.gain.value = 0.45; musicBus.connect(master);
    ambBus = ac.createGain(); ambBus.connect(master);
    sfxBus = ac.createGain(); sfxBus.connect(master);
    // "Dehors" : tout ce qui vient de la rue passe par ce filtre, qui s'étouffe quand on est dans l'immeuble
    outFilter = ac.createBiquadFilter(); outFilter.type = 'lowpass'; outFilter.frequency.value = 400; outFilter.connect(ambBus);

    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // Écho : bruit qui s'éteint = grande cage d'escalier en béton
    const len = ac.sampleRate * 2.8, ir = ac.createBuffer(2, len, ac.sampleRate);
    for (let c = 0; c < 2; c++) { const ch = ir.getChannelData(c); for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2); }
    reverb = ac.createConvolver(); reverb.buffer = ir;
    const rg = ac.createGain(); rg.gain.value = 0.6; reverb.connect(rg); rg.connect(master);
    revSend = ac.createGain(); revSend.gain.value = 0.5; revSend.connect(reverb);

    startWind(); startDrone(); startBreath(); startCrt();
    scheduleMusic(); scheduleSiren(18000); scheduleClang(35000);
    A.footstep = footstep; A.thud = thud; A.flick = flick; A.update = update;
  };
  A.suspend = () => { if (ac && ac.state === 'running') ac.suspend(); };
  A.resume = () => { if (ac && ac.state === 'suspended') ac.resume(); };
  A.toggleMusic = () => { musicOn = !musicOn; if (ac) musicBus.gain.setTargetAtTime(musicOn ? 0.45 : 0, ac.currentTime, 0.2); };
  A.setVolume = v => { if (ac) master.gain.setTargetAtTime(v, ac.currentTime, 0.1); };

  const noiseSrc = loop => { const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = loop; return s; };

  function startWind() {                                   // vent : bruit filtré qui ondule lentement
    const s = noiseSrc(true); s.start();
    windFilter = ac.createBiquadFilter(); windFilter.type = 'bandpass'; windFilter.frequency.value = 300; windFilter.Q.value = 0.6;
    windGain = ac.createGain(); windGain.gain.value = 0.05;
    const lfo = ac.createOscillator(); lfo.frequency.value = 0.06; const lg = ac.createGain(); lg.gain.value = 0.025; lfo.connect(lg); lg.connect(windGain.gain); lfo.start();
    s.connect(windFilter); windFilter.connect(windGain); windGain.connect(outFilter);
  }
  function startDrone() {                                  // grondement grave permanent (l'immeuble, la ville)
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 150;
    const g = ac.createGain(); g.gain.value = 0.13;
    for (const hz of [41, 41.7, 82.2]) { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = hz; o.connect(f); o.start(); }
    f.connect(g); g.connect(ambBus);
  }
  function startBreath() {                                 // respiration : plus rapide et plus forte après un sprint
    const s = noiseSrc(true); s.start();
    const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 850; f.Q.value = 0.9;
    breathGain = ac.createGain(); breathGain.gain.value = 0; s.connect(f); f.connect(breathGain); breathGain.connect(sfxBus);
  }
  function startCrt() {                                    // bourdonnement du vieil écran, positionné dans l'espace
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 600;
    crtGain = ac.createGain(); crtGain.gain.value = 0;
    const p = ac.createPanner(); p.panningModel = 'HRTF'; p.refDistance = 1; p.rolloffFactor = 1.6;
    if (G.crtPos) { p.positionX.value = G.crtPos.x; p.positionY.value = G.crtPos.y; p.positionZ.value = G.crtPos.z; }
    for (const hz of [100, 200.5]) { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = hz; o.connect(f); o.start(); }
    const n = noiseSrc(true); n.start(); const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 5000; const ng = ac.createGain(); ng.gain.value = 0.05;
    n.connect(hp); hp.connect(ng); ng.connect(crtGain);
    f.connect(crtGain); crtGain.connect(p); p.connect(ambBus);
  }
  const SCALE = [110, 130.8, 146.8, 164.8, 196, 220];
  function scheduleMusic() {                               // musique générative : notes lentes, graves, dans l'écho
    if (musicOn) { const hz = SCALE[Math.floor(Math.random() * SCALE.length)] / (Math.random() < 0.4 ? 2 : 1); pad(hz, 0.045, 4, 7); if (Math.random() < 0.3) pad(hz * 3, 0.01, 2, 6); }
    setTimeout(scheduleMusic, 5000 + Math.random() * 5000);
  }
  function pad(hz, vol, attack, release) {
    const t = ac.currentTime, g = ac.createGain(); g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + attack); g.gain.linearRampToValueAtTime(0, t + attack + release);
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 650;
    for (const det of [-4, 4]) { const o = ac.createOscillator(); o.type = 'triangle'; o.frequency.value = hz; o.detune.value = det; o.connect(f); o.start(t); o.stop(t + attack + release + 0.2); }
    f.connect(g); g.connect(musicBus); g.connect(revSend);
  }
  function scheduleSiren(delay) {                          // sirène très lointaine (étouffée quand on est à l'intérieur)
    setTimeout(() => {
      const t = ac.currentTime, o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = 620;
      const l = ac.createOscillator(); l.frequency.value = 0.4; const lg = ac.createGain(); lg.gain.value = 130; l.connect(lg); lg.connect(o.frequency);
      const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 800;
      const g = ac.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.03, t + 3); g.gain.setValueAtTime(0.03, t + 10); g.gain.linearRampToValueAtTime(0, t + 15);
      const pan = ac.createStereoPanner(); pan.pan.value = Math.random() * 1.6 - 0.8;
      o.connect(f); f.connect(g); g.connect(pan); pan.connect(outFilter); pan.connect(revSend);
      o.start(t); l.start(t); o.stop(t + 15.5); l.stop(t + 15.5);
      scheduleSiren(30000 + Math.random() * 30000);
    }, delay);
  }
  function scheduleClang(delay) {                          // un bruit métallique, quelque part dans l'immeuble ou dehors
    setTimeout(() => {
      const t = ac.currentTime, s = noiseSrc(false), f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 900 + Math.random() * 1500; f.Q.value = 7;
      const g = ac.createGain(); g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.001, t + 1.4);
      s.connect(f); f.connect(g); g.connect(revSend); g.connect(outFilter); s.start(t, Math.random() * 1.5, 1.4);
      scheduleClang(45000 + Math.random() * 60000);
    }, delay);
  }

  // --- Sons ponctuels ---
  function footstep(sprint, zone) {                        // un souffle grave très court + écho
    const t = ac.currentTime, s = noiseSrc(false), f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 240 + Math.random() * 240;
    const g = ac.createGain(), v = sprint ? 0.6 : 0.28;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.008); g.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
    s.connect(f); f.connect(g); g.connect(sfxBus); g.connect(revSend); s.start(t, Math.random() * 1.5, 0.15);
  }
  function thud(vol, hz, dur) {
    const t = ac.currentTime, o = ac.createOscillator(); o.frequency.setValueAtTime(hz * 2, t); o.frequency.exponentialRampToValueAtTime(hz, t + 0.12);
    const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(sfxBus); g.connect(revSend); o.start(t); o.stop(t + dur + 0.05);
  }
  function flick() {                                       // la molette d'un briquet : deux petits claquements secs
    for (const dt of [0, 0.11]) {
      const t = ac.currentTime + dt, s = noiseSrc(false), f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 2800;
      const g = ac.createGain(); g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
      s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t, Math.random(), 0.06);
    }
  }

  // Appelé à chaque image : ajuste le son selon le lieu et l'effort, place "l'oreille" sur la caméra
  function update(dt, cam, dir, zone, exert) {
    const t = ac.currentTime, inside = zone === 'in';
    outFilter.frequency.setTargetAtTime(inside ? 380 : 7000, t, 0.4);
    windGain.gain.setTargetAtTime(inside ? 0.025 : 0.06, t, 0.5);
    revSend.gain.setTargetAtTime(inside ? 0.95 : 0.4, t, 0.5);
    crtGain.gain.setTargetAtTime(0.045, t, 0.2);
    breathPhase += dt * (0.28 + exert * 1.1) * 6.2832;
    breathGain.gain.setTargetAtTime((0.004 + exert * 0.09) * Math.pow(Math.sin(breathPhase) * 0.5 + 0.5, 2), t, 0.05);
    const L = ac.listener;
    if (L.positionX) {
      L.positionX.value = cam.x; L.positionY.value = cam.y; L.positionZ.value = cam.z;
      L.forwardX.value = dir.x; L.forwardY.value = dir.y; L.forwardZ.value = dir.z; L.upX.value = 0; L.upY.value = 1; L.upZ.value = 0;
    }
  }

  G.loaded.push('audio');
})();

<script>
/* ---- js/game.js ---- */
/* =====================================================================
   game.js : le chef d'orchestre. Démarrage, boucle principale, souris/clavier, interactions, intro.
   L'ordre à chaque image : joueur -> caméra -> animations -> lumières -> son -> dessin.
   ===================================================================== */
(function () {
  'use strict';
  const G = window.G, T = G.T;
  const el = id => document.getElementById(id);
  let playing = false, started = false, locked = false, dragging = false, everLocked = false, last = 0, time = 0, canvasEl = null;
  const fwd = new T.Vector3();

  // Texte discret en bas de l'écran (pas d'interface lourde)
  G.say = function (text, ms) {
    const c = el('caption'); c.textContent = text; c.style.opacity = 1;
    clearTimeout(G._sayT); G._sayT = setTimeout(() => { c.style.opacity = 0; }, ms || 5000);
  };

  // Construit le monde pas à pas (progress sert à la barre de chargement du menu)
  G.boot = async function (canvas, progress) {
    const tick = () => new Promise(r => setTimeout(r, 20));
    canvasEl = canvas;
    G.loadSettings();
    progress(0.05, 'Rendu'); G.initRender(canvas); await tick();
    progress(0.2, 'Matières : béton, rouille, asphalte'); G.buildMaterials(); await tick();
    progress(0.5, 'Immeuble, escalier, rue'); G.buildWorld(); await tick();
    progress(0.9, 'Joueur'); G.initPlayer(); G.updateLamps(0, 0); G.render(0);
    progress(1, 'Prêt');
    last = performance.now(); requestAnimationFrame(loop);
    bindInput();
  };

  // Appelé quand le joueur clique pour entrer (ou reprendre après une pause)
  G.start = function () {
    G.audio.init(); G.audio.resume(); G.audio.setVolume(G.settings.volume);
    playing = true; last = performance.now();
    try { const r = canvasEl.requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch (e) { /* tant pis : clic maintenu pour tourner */ }
    if (!started) { started = true; intro(); }
  };

  // Début calme : écran noir, le titre, puis on ouvre les yeux dans le studio
  function intro() {
    const f = el('fade'), t = el('title');
    f.style.transition = 'none'; f.style.opacity = 1; t.style.opacity = 0;
    setTimeout(() => { t.style.transition = 'opacity 2s'; t.style.opacity = 1; }, 300);
    setTimeout(() => { t.style.opacity = 0; }, 3400);
    setTimeout(() => { f.style.transition = 'opacity 5s ease-out'; f.style.opacity = 0; }, 4200);
    setTimeout(() => { const h = el('hint'); h.style.opacity = 1; setTimeout(() => { h.style.opacity = 0; }, 9000); }, 9500);
  }

  function pause() {
    playing = false; G.audio.suspend();
    el('enter-text').textContent = 'PAUSE'; el('enter-sub').textContent = 'cliquer pour reprendre'; el('enter').hidden = false;
  }

  function bindInput() {
    addEventListener('keydown', e => {
      G.keys[e.code] = true;
      if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
      if (e.code === 'KeyM') G.audio.toggleMusic();
      if (e.code === 'KeyE' && playing && G.focus) G.focus.use();
    });
    addEventListener('keyup', e => { G.keys[e.code] = false; });
    addEventListener('blur', () => { for (const k in G.keys) G.keys[k] = false; });
    addEventListener('mousemove', e => {
      if (!playing || !(locked || dragging)) return;
      const s = 0.0022 * G.settings.sens;
      G.P.yaw -= e.movementX * s; G.P.pitch = G.clamp(G.P.pitch - e.movementY * s, -1.5, 1.5);
    });
    canvasEl.addEventListener('mousedown', () => { dragging = true; });
    addEventListener('mouseup', () => { dragging = false; });
    document.addEventListener('pointerlockchange', () => {
      locked = document.pointerLockElement === canvasEl;
      if (locked) everLocked = true; else if (everLocked && playing) pause();     // Échap = pause
    });
  }

  // Quel objet le joueur regarde-t-il, de près ? (une seule indication discrète à l'écran)
  function updateInteract() {
    const cam = G.camera; cam.getWorldDirection(fwd);
    let best = null, bd = 1e9;
    for (const it of G.interactables) {
      const to = it.pos.clone().sub(cam.position), d = to.length();
      if (d < it.radius && to.normalize().dot(fwd) > 0.82 && d < bd) { best = it; bd = d; }
    }
    G.focus = best;
    const pr = el('prompt'); pr.textContent = best ? '[E]  ' + best.prompt : ''; pr.style.opacity = best ? 1 : 0;
  }

  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
    if (playing) { G.updatePlayer(dt); updateInteract(); }
    G.updateCamera(dt, time);
    for (const a of G.animated) a.update(dt);
    G.updateLamps(dt, time);
    const zone = G.zoneAt(G.P.pos);
    G.scene.fog.density += ((zone === 'in' ? 0.032 : 0.06) - G.scene.fog.density) * Math.min(1, dt * 1.5);   // plus clair dans l'immeuble
    if (playing) { G.camera.getWorldDirection(fwd); G.audio.update(dt, G.camera.position, fwd, zone, G.P.exert); }
    G.render(time);
  }

  G.loaded.push('game');
})();

</script>

<script>
/* =====================================================================
   Menu + chargeur. Le jeu complet (dossier js/) ne se charge qu'après "JOUER".
   (Dans la version "tout-en-un" publiée en ligne, les fichiers sont déjà inclus : on saute le téléchargement.)
   ===================================================================== */
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const FILES = ['core', 'render', 'textures', 'world', 'player', 'audio', 'game'];
  const S = { quality: 'medium', sens: 1, volume: 0.9 };
  try { Object.assign(S, JSON.parse(localStorage.getItem('paris2193') || '{}')); } catch (e) { /* pas grave */ }
  const save = () => { try { localStorage.setItem('paris2193', JSON.stringify(S)); } catch (e) { /* pas grave */ } };
  const show = id => { for (const p of ['p-main', 'p-opt', 'p-load']) $(p).hidden = p !== id; };

  // --- Grain animé du fond du menu ---
  const gc = $('grain'), gx = gc.getContext('2d'), gi = gx.createImageData(160, 90);
  const grainTimer = setInterval(() => { for (let i = 0; i < gi.data.length; i += 4) { const v = Math.random() * 255; gi.data[i] = gi.data[i + 1] = gi.data[i + 2] = v; gi.data[i + 3] = 255; } gx.putImageData(gi, 0, 0); }, 110);

  // --- Options ---
  function refreshOpt() {
    document.querySelectorAll('[data-q]').forEach(b => b.classList.toggle('on', b.dataset.q === S.quality));
    $('o-sens').value = S.sens; $('o-vol').value = S.volume;
  }
  document.querySelectorAll('[data-q]').forEach(b => b.addEventListener('click', () => { S.quality = b.dataset.q; save(); refreshOpt(); }));
  $('o-sens').addEventListener('input', e => { S.sens = +e.target.value; save(); });
  $('o-vol').addEventListener('input', e => { S.volume = +e.target.value; save(); });
  $('b-opt').addEventListener('click', () => { refreshOpt(); show('p-opt'); });
  $('b-back').addEventListener('click', () => show('p-main'));

  // --- Chargement des fichiers puis construction du monde ---
  const loadScript = src => new Promise((ok, ko) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => ko(new Error('Fichier introuvable : ' + src)); document.head.appendChild(s); });
  function setBar(p, msg) { $('bar').firstElementChild.style.width = Math.round(p * 100) + '%'; if (msg) $('loadmsg').textContent = msg; }

  let busy = false;
  $('b-play').addEventListener('click', async () => {
    if (busy) return; busy = true; show('p-load'); setBar(0.02, 'Chargement du code');
    try {
      for (let i = 0; i < FILES.length; i++) {
        if (!G.loaded.includes(FILES[i])) await loadScript('js/' + FILES[i] + '.js');
        setBar(0.02 + 0.3 * (i + 1) / FILES.length, 'js/' + FILES[i] + '.js');
      }
      await G.boot($('game'), (p, msg) => setBar(0.32 + 0.68 * p, msg));
      clearInterval(grainTimer);
      $('menu').hidden = true; $('enter-text').textContent = 'PARIS 2193'; $('enter').hidden = false;
    } catch (err) {
      busy = false; $('loadmsg').textContent = 'Erreur : ' + err.message + ' (ouvre la console F12 pour le détail)'; console.error(err);
    }
  });
  $('enter').addEventListener('click', () => { $('enter').hidden = true; G.start(); });
})();
</script>
